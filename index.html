<style>
:root{
  --bg:#EDEFEA; --surface:#FFFFFF; --surface-2:#F6F7F4; --ink:#131B24; --muted:#5B6571; --line:#D8DCD4;
  --accent:#E3601B; --accent-ink:#FFFFFF; --accent-soft:#FCE7DA;
  --nav:#15212E; --nav-ink:#EEF1EC; --nav-muted:#8E9AA6;
  --ok:#1B7F4D; --on-ok:#FFFFFF; --ok-bg:#DFF1E6; --bad:#BD3528; --bad-bg:#F7E0DC;
  --warn:#7D5A00; --warn-bg:#FAEFC9; --info:#285683; --info-bg:#E1EAF4;
  --shadow:0 1px 2px rgba(20,30,40,.06),0 6px 18px rgba(20,30,40,.07);
  --display:"Secular One","Assistant",system-ui,sans-serif;
  --body:"Assistant",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0D131A; --surface:#161F29; --surface-2:#1C2733; --ink:#EDF0EB; --muted:#9BA5B0; --line:#29343F;
    --accent:#F0793A; --accent-ink:#1A0F08; --accent-soft:#3A2214;
    --nav:#080C11; --nav-ink:#EDF0EB; --nav-muted:#7C8894;
    --ok:#4DBA80; --on-ok:#08170F; --ok-bg:#132C1F; --bad:#EC6E60; --bad-bg:#371816; --warn:#E3B84B; --warn-bg:#30270D; --info:#86B4E2; --info-bg:#152536;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0D131A; --surface:#161F29; --surface-2:#1C2733; --ink:#EDF0EB; --muted:#9BA5B0; --line:#29343F;
  --accent:#F0793A; --accent-ink:#1A0F08; --accent-soft:#3A2214;
  --nav:#080C11; --nav-ink:#EDF0EB; --nav-muted:#7C8894;
  --ok:#4DBA80; --on-ok:#08170F; --ok-bg:#132C1F; --bad:#EC6E60; --bad-bg:#371816; --warn:#E3B84B; --warn-bg:#30270D; --info:#86B4E2; --info-bg:#152536;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{background:var(--bg);margin:0}
[hidden]{display:none!important}
img{max-width:100%}
body{font-family:var(--body);color:var(--ink);font-size:16px;line-height:1.45}
#app{max-width:520px;margin:0 auto;padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.demo{background:var(--warn-bg);color:var(--warn);font-size:13px;font-weight:700;text-align:center;padding:6px 16px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--nav);color:var(--nav-ink);padding:10px 16px 12px;display:grid;gap:8px}
.topbar .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.topbar .j{font-size:13px;color:var(--nav-muted);font-weight:600}
.topbar .cash{font-family:var(--display);font-size:20px}
.topbar .cash small{font-family:var(--body);font-size:12px;color:var(--nav-muted);font-weight:600;margin-inline-start:6px}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.14);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .3s}
main{padding:16px;display:grid;gap:16px}
h1,h2,h3{margin:0;text-wrap:balance}
.eyebrow{font-size:12px;letter-spacing:.06em;font-weight:800;color:var(--muted)}
.card{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:16px;display:grid;gap:12px}
.next{border-top:5px solid var(--accent);padding-top:14px}
.next .name{font-family:var(--display);font-size:27px;line-height:1.15}
.addr{font-size:18px;font-weight:600}
.city{display:inline-block;margin-inline-start:6px;font-size:13px;font-weight:700;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:1px 9px;vertical-align:2px}
.collect{display:flex;align-items:center;justify-content:space-between;gap:10px;border-radius:12px;padding:12px 14px;font-weight:800}
.collect .big{font-family:var(--display);font-size:28px;font-weight:400}
.collect small{display:block;font-size:13px;font-weight:700}
.c-collect{background:var(--accent-soft);color:var(--accent)}
.c-verify{background:var(--warn-bg);color:var(--warn)}
.c-paid{background:var(--ok-bg);color:var(--ok)}
.c-credit{background:var(--info-bg);color:var(--info)}
.items{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--ink);border-radius:10px;padding:4px 10px;font-weight:800;font-size:17px}
.pill .kg{font-size:13px;font-weight:700;color:var(--muted)}
.note{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:9px 12px;font-weight:700;font-size:15px}
.okbox{background:var(--ok-bg);color:var(--ok);border-radius:10px;padding:9px 12px;font-weight:700;font-size:15px}
.mem{background:var(--surface-2);border:1px dashed var(--line);border-radius:10px;padding:9px 12px;font-size:14px;display:grid;gap:6px}
.mem img{border-radius:8px;max-height:140px;object-fit:cover}
.acts{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px}
.act{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:58px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface-2);font-weight:800;font-size:14px;text-decoration:none;color:var(--ink)}
.act b{font-size:20px;line-height:1}
.act.waze{background:var(--info-bg);border-color:transparent;color:var(--info)}
.go{display:grid;grid-template-columns:2fr 1fr;gap:8px}
.btn{border:0;border-radius:14px;min-height:60px;font-weight:800;font-size:19px;padding:0 14px}
.btn-ok{background:var(--ok);color:var(--on-ok)}
.btn-bad{background:var(--surface);color:var(--bad);border:2px solid var(--bad)}
.btn-accent{background:var(--accent);color:var(--accent-ink)}
.btn-ghost{background:transparent;border:2px solid var(--line);color:var(--ink)}
.btn-sm{min-height:44px;font-size:16px;border-radius:11px}
.list{display:grid;gap:8px}
.li{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:10px;background:var(--surface);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow);text-align:start;border:0;width:100%}
.li .n{font-family:var(--display);color:var(--muted);text-align:center}
.li .t{font-weight:800;line-height:1.2}
.li .s{font-size:14px;color:var(--muted)}
.li .ctl{display:flex;gap:4px}
.li.sel{outline:3px solid var(--accent)}
.li.sel .n{color:var(--accent);font-size:20px}
.ic{width:38px;height:38px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface-2);font-weight:800}
.tag{font-size:12px;font-weight:800;border-radius:999px;padding:2px 8px;white-space:nowrap}
.t-ok{background:var(--ok-bg);color:var(--ok)} .t-bad{background:var(--bad-bg);color:var(--bad)} .t-acc{background:var(--accent-soft);color:var(--accent)} .t-info{background:var(--info-bg);color:var(--info)} .t-warn{background:var(--warn-bg);color:var(--warn)}
.sec{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.sec h3{font-size:17px}
.muted{color:var(--muted)}
.nav{position:fixed;inset-inline:0;bottom:0;z-index:30;background:var(--nav);padding:6px 12px calc(6px + env(safe-area-inset-bottom,0px))}
.nav .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tab{background:transparent;border:0;color:var(--nav-muted);font-weight:800;font-size:14px;min-height:54px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tab b{font-size:19px}
.tab[aria-current="page"]{color:var(--nav-ink);background:rgba(255,255,255,.08)}
.fab{position:fixed;z-index:31;bottom:calc(80px + env(safe-area-inset-bottom,0px));inset-inline-end:max(16px,calc(50% - 244px));min-height:52px;padding:0 18px;border-radius:999px;background:var(--accent);color:var(--accent-ink);border:0;font-size:17px;font-weight:800;box-shadow:var(--shadow)}
.scrim{position:fixed;inset:0;background:rgba(8,12,17,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:14px}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto}
.sheet h2{font-family:var(--display);font-weight:400;font-size:23px}
.field{display:grid;gap:6px}
.field>label,.lbl{font-weight:800;font-size:14px;color:var(--muted)}
.inp{width:100%;min-height:48px;border-radius:11px;border:1.5px solid var(--line);background:var(--surface);padding:8px 12px;font-size:17px}
textarea.inp{min-height:70px;resize:vertical}
.steps{display:grid;gap:8px}
.step{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;background:var(--surface);border-radius:12px;padding:8px 12px}
.step .l{font-weight:800}
.step .l small{display:block;font-weight:600;font-size:13px;color:var(--muted)}
.stp{display:flex;align-items:center;gap:6px}
.stp button{width:46px;height:46px;border-radius:11px;border:1.5px solid var(--line);background:var(--surface-2);font-size:24px;font-weight:800}
.stp output{min-width:34px;text-align:center;font-family:var(--display);font-size:24px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:var(--surface);border-radius:12px;min-height:48px;padding:0 14px;font-weight:800;font-size:16px}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.sum{display:flex;justify-content:space-between;align-items:center;background:var(--surface);border-radius:12px;padding:12px 14px;font-weight:800}
.sum .big{font-family:var(--display);font-size:26px;font-weight:400}
.photo{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.thumb{width:64px;height:64px;object-fit:cover;border-radius:10px}
.filebtn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:2px dashed var(--line);border-radius:11px;min-height:48px;padding:0 14px;font-weight:800;background:var(--surface)}
.filebtn.big{min-height:60px;border-style:solid;border-color:var(--accent);color:var(--accent);font-size:18px}
.filebtn input{position:absolute;inset:0;opacity:0}
.hint{font-size:13px;color:var(--muted);margin:0}
.err{font-size:14px;color:var(--bad);font-weight:800;margin:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:var(--surface-2);border-radius:12px;padding:12px;display:grid;gap:2px}
.kpi .v{font-family:var(--display);font-size:24px}
.kpi .k{font-size:13px;font-weight:700;color:var(--muted)}
.cgrid{display:grid;grid-template-columns:auto 1fr 1fr;gap:8px;align-items:center}
.cgrid .h{font-size:13px;font-weight:800;color:var(--muted);text-align:center}
.cgrid .r{font-weight:800;padding-inline-end:4px}
.cin{width:100%;min-height:60px;border-radius:12px;border:2px solid var(--line);background:var(--surface);text-align:center;font-family:var(--display);font-size:30px;padding:0 6px}
.cin:focus{border-color:var(--accent);outline:none}
.cin.has{border-color:var(--ink)}
.msg{white-space:pre-line;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:700;line-height:1.5}
.linkbtn{display:flex;align-items:center;justify-content:center;text-decoration:none}
details.amg{background:var(--surface-2);border-radius:12px;padding:6px 12px 10px}
details.amg summary{font-weight:800;cursor:pointer;min-height:40px;display:flex;align-items:center}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:start}
th{font-size:12px;color:var(--muted);font-weight:800;letter-spacing:.04em}
td.v,th.v{text-align:end}
.tbl{overflow-x:auto}
.report{font-size:15px;display:grid;gap:10px}
.report h3{font-size:16px}
.mismatch{color:var(--bad);font-weight:800}
.match{color:var(--ok);font-weight:800}
.hero{display:grid;gap:4px}
.hero h1{font-family:var(--display);font-weight:400;font-size:30px}
.toast{position:fixed;inset-inline:16px;bottom:calc(140px + env(safe-area-inset-bottom,0px));z-index:50;max-width:488px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 14px;font-weight:800;text-align:center}
.done-li{opacity:.82}
.li-main{background:none;border:0;padding:0;text-align:start;min-width:0;min-height:44px}
.drag{width:38px;height:44px;display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--muted);touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.li.dragging{position:relative;z-index:5;box-shadow:0 10px 28px rgba(0,0,0,.28);outline:2px solid var(--accent)}
.li.shift{transition:transform .15s}
.custline{font-size:15px;color:var(--muted);margin-top:-6px}
.custline b{color:var(--ink)}
.linkish{background:var(--surface-2);border:1.5px dashed var(--line);border-radius:12px;min-height:48px;padding:6px 12px;text-align:start;font-size:15px;color:var(--ink)}
.hist{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
/* the printable A4 report — always black on white, whatever the phone's theme */
#printRoot{display:none}
.docwrap{overflow:hidden;margin:0 auto;min-width:0;width:100%}
.paper{width:794px;height:1123px;background:#fff;color:#000;padding:38px 42px 30px;box-sizing:border-box;position:relative;overflow:hidden;margin:0 auto 16px;box-shadow:0 2px 10px rgba(0,0,0,.25);font-family:Arial,"Assistant",sans-serif;font-size:13px;line-height:1.35;direction:rtl}
.paper h1{font-size:20px;margin:0}
.paper .hdr{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2.5px solid #000;padding-bottom:6px;margin-bottom:12px;gap:10px}
.paper .hdr .f{font-size:14px}
.paper .hdr .f b{font-size:15px}
.paper table{border-collapse:collapse;width:auto;font-size:12.5px}
.paper td,.paper th{border:1.2px solid #000;padding:4px 7px;text-align:center;color:#000;letter-spacing:0}
.paper th{font-weight:700;font-size:12px;background:#eee}
.paper .lbl2{font-weight:700;text-align:start;border:0;padding-inline-end:10px;white-space:nowrap}
.paper .row2{display:flex;gap:26px;align-items:flex-start;margin:6px 0 10px}
.paper .sec2{font-weight:700;font-size:14px;margin:12px 0 5px;text-decoration:underline}
.paper .big2{font-size:15px;font-weight:700}
.paper .wide{width:100%}
.paper .wide td,.paper .wide th{text-align:start}
.paper .wide td.c{text-align:center}
.paper .ord{font-size:11.5px}
.paper .ord td,.paper .ord th{padding:3px 4px}
.paper .ord td.c{width:26px}
.paper .ord .nm{width:175px}
.paper .ord td:last-child{width:150px}
.paper .ord .ad{font-size:10px;font-weight:400;color:#333}
.paper .ord td.chg{font-weight:800;text-decoration:underline;font-size:13px}
.paper .grp td{background:#e6e6e6;font-weight:700;text-align:start}
.paper .warn2{font-weight:700}
.paper .sig{display:grid;grid-template-columns:1fr 1fr;gap:10px 30px;margin-top:10px}
.paper .sig div{border-bottom:1.2px solid #000;padding-top:18px;font-size:12.5px}
.paper .foot{position:absolute;bottom:14px;inset-inline:42px;display:flex;justify-content:space-between;font-size:10.5px;color:#444}
.paper .ok2{font-weight:700}
.paper .bad2{font-weight:700;text-decoration:underline}
.paper ul{margin:2px 0;padding-inline-start:18px}
/* FEEDBACK #48: the delivery note is as long as its content, not a full A4 */
.paper.dnp{height:auto;padding-bottom:44px;font-size:14px}
.paper.dnp td,.paper.dnp th{padding:6px 8px}
.sigpad{display:block;width:100%;height:190px;background:#fff;border:2px dashed var(--line);border-radius:12px;touch-action:none;cursor:crosshair}
@media print{
  @page{size:A4;margin:0}
  html,body{background:#fff!important}
  #app,#sheetRoot,#toastRoot{display:none!important}
  #printRoot{display:block!important}
  .paper{margin:0;box-shadow:none;page-break-after:always;break-after:page}
}
.center{text-align:center}
.loading{display:grid;place-items:center;gap:10px;padding:40px 0;font-weight:800}
.spin{width:36px;height:36px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--accent);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}.bar i{transition:none}}
</style>

function migrate(s){
  /* days saved by the first version had one journal and no journal list */
  if(!s.journals) s.journals = s.source==='pdf' ? [{no:s.journal, date:s.date, driver:s.driver, check:s.check}] : [];
  s.stops.forEach(function(x){ if(!x.journal && s.source==='pdf') x.journal=s.journal; });
  if(!s.facility) s.facility=[];
  if(s.dayNote==null) s.dayNote='';
  if(!s.handover) s.handover={cash:null, nq:null, note:''};   /* FEEDBACK #30: what was really handed to the clerk */
  if(!s.day) s.day = s.closedAt ? s.date : todayStr();   /* the work day; the journal's own date can be the day it was printed */
  if(!s.firstAt && !s.closedAt){ var ats=(s.stops||[]).map(function(x){ return x.result && x.result.at; }).filter(Boolean);
    if(ats.length){ s.firstAt=Math.min.apply(null, ats); s.day=dateStr(new Date(s.firstAt)); } }
  /* 30/09: loading / unloading is typed as quantities. Older entries had a count coming in and going out — the
     difference becomes the quantities (more full = loaded, fewer empties = unloaded, and so on). */
  s.facility.forEach(function(f){ if(f.mv) return; var mv={lf:{1:0,2:0}, le:{1:0,2:0}, uf:{1:0,2:0}, ue:{1:0,2:0}};
    CF.forEach(function(x){ var d=((f.out||{})[x.k]||0)-((f.inn||{})[x.k]||0), sz=x.k[0]==='g'?2:1, full=x.k[1]==='m';
      if(d>0) mv[full?'lf':'le'][sz]+=d; if(d<0) mv[full?'uf':'ue'][sz]-=d; });
    f.mv=mv; });
  return s;
}

function idbDo(store,mode,fn){ return idb().then(function(d){ return new Promise(function(res,rej){ var tx=d.transaction(store,mode), st=tx.objectStore(store), out=fn(st);

function deposits(items,actual){ return items.reduce(function(t,i){ return t+(isDep(i)?(actual?(i.actual||0):i.qty)*i.price:0); },0); }
function totalOf(s,actual){
  /* the journal discount is spread over the gas actually supplied; deposits are never discounted */
  var ord=gross(s.items,false), g=gross(s.items,actual), dg=s.discGross||0;
  var d = ord ? dg*(Math.min(g,ord)/ord) : 0;
  return Math.max(0, Math.round((g-d+deposits(s.items,actual))*100)/100);

/* ---------- יומן משאית (01/10): continuity follows the TRUCK, not the driver's day ----------
   The truck Nadir works with stays at the facility overnight; Salem unloads its empties and loads full ones before he
   arrives, and three trucks rotate between Ofakim and the facility. So each truck (by licence plate) keeps its latest
   count — in the phone and on the server, shared by all drivers. The morning exit count is the truth: its difference
   from the truck's last count is what happened at the facility (to compare with the pink form), and the day's opening
   is that exit count — the same number the top bar starts from, so the bar and the report cannot disagree. */
function plateOk(p){ return String(p||'').replace(/\D/g,'').slice(0,10); }
function trucks(){ return lsGet('gazgal-trucks',{}); }
function plates(){ var T=trucks(); return Object.keys(T).sort(function(a,b){ return ((T[b]||{}).at||0)-((T[a]||{}).at||0); }); }

function truckSave(plate,c){

  var d=lsGet('gazgal-trucks-dirty',[]); if(d.indexOf(plate)<0) d.push(plate); lsSet('gazgal-trucks-dirty',d);
  syncTrucks();
}
async function syncTrucks(){
  if(typeof bot==='undefined' || !BOT_API || bot.status!=='active') return;
  try{
    var T=trucks(), d=lsGet('gazgal-trucks-dirty',[]);
    if(d.length){ var r=await botFetch('/api/trucks',{method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({items:d.map(function(p){ return {plate:p, data:T[p]}; })})});
      if(r.ok) lsSet('gazgal-trucks-dirty', lsGet('gazgal-trucks-dirty',[]).filter(function(p){ return d.indexOf(p)<0; })); }
    var g=await botFetch('/api/trucks'); if(!g.ok) return;
    var items=(await g.json()).items||[], T2=trucks(), ch=false;
    items.forEach(function(it){ var mine=T2[it.plate]; if(it.data && (!mine || (it.data.at||0)>(mine.at||0))){ T2[it.plate]=it.data; ch=true; } });
    if(ch) lsSet('gazgal-trucks',T2);
  }catch(e){}
}

function truckMove(a,b){ var m={}, any=false; CF.forEach(function(f){ m[f.k]=(b[f.k]||0)-(a[f.k]||0); if(m[f.k]) any=true; }); return any ? m : null; }
function moveWords(m){
  if(!m) return '';
  var L=[], kg={g:'48',k:'12'};
  ['g','k'].forEach(function(s){ var f=m[s+'m'], e=m[s+'r'];
    if(f>0) L.push('הועמסו '+f+'×'+kg[s]+' מלאים'); if(f<0) L.push('הורדו '+(-f)+'×'+kg[s]+' מלאים');
    if(e<0) L.push('פורקו '+(-e)+'×'+kg[s]+' ריקים'); if(e>0) L.push('נוספו '+e+'×'+kg[s]+' ריקים'); });
  return L.join(' · ');
}
/* ---------- FEEDBACK #53: the morning counts Eyal sends in WhatsApp, pasted in one go ----------
   Every morning Eyal counts the ramp and the trucks at the Ofakim warehouse and sends each count to the drivers' group,
   in the same format the app writes ("רמפה כניסה" / "44 גמ" / "76 ק״מ" / "5 ק״ג 8 מלא"). Copying all of them from
   WhatsApp and pasting here reads every message, files it by point and moment, keeps the history (phone + server) and
   compares each count with the point's last count before today — the ramp should not change overnight — and with the
   same count the day before. The app's own counts go into the same history. */
var COUNT_KEY={'גמ':'gm','קמ':'km','גר':'gr','קר':'kr'}, POINT_OF={'רמפה':'ramp','אייל':'eyal','נדיר':'me','משאית שניה':'truck3','משאית שנייה':'truck3','משאית 2':'truck3'};
var AMG_LBL={a5m:'אמגזית 5 מלא', a5r:'אמגזית 5 ריק', a25m:'אמגזית 2.5 מלא', a25r:'אמגזית 2.5 ריק'};
function countLog(){ return lsGet('gazgal-countlog',[]); }
function putCountLog(items){
  var L=countLog(), have={}, n=0; L.forEach(function(x){ have[x.id]=1; });
  items.forEach(function(x){ if(have[x.id]) return; have[x.id]=1; L.push(x); n++; });
  var cut=Date.now()-120*864e5; L=L.filter(function(x){ return (x.at||0)>cut; }).sort(function(a,b){ return a.at-b.at; }).slice(-2000);
  lsSet('gazgal-countlog', L);
  if(n){ var d=lsGet('gazgal-countlog-dirty',[]); items.forEach(function(x){ if(d.indexOf(x.id)<0) d.push(x.id); }); lsSet('gazgal-countlog-dirty', d); syncCountLog(); }
  return n;
}
function normDay(s){ var m=/(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{2,4})/.exec(s||''); if(!m) return ''; return ('0'+m[1]).slice(-2)+'/'+('0'+m[2]).slice(-2)+'/'+(m[3].length===2?'20'+m[3]:m[3]); }
function atOf(day,time){ var d=/^(\d\d)\/(\d\d)\/(\d{4})$/.exec(day), t=/(\d{1,2}):(\d\d)/.exec(time||'');
  return d ? new Date(+d[3], +d[2]-1, +d[1], t?+t[1]:12, t?+t[2]:0).getTime() : Date.now(); }
function countId(c){ return 'K'+c.day.replace(/\D/g,'')+'-'+c.point+(c.pointText||'')+'-'+c.moment+'-'+(c.time||Object.keys(c.v).map(function(k){ return k+c.v[k]; }).join('')); }
function parseCounts(txt){
  var head=/^\[([^\]]+)\]\s*([^:]{1,40}):\s*(.*)$/, msgs=[], cur=null;   /* "[5:57, 4.10.2026] אייל נהג תקומה: רמפה כניסה" */
  String(txt||'').replace(/[\u200e\u200f\u202a-\u202e]/g,'').split(/\r?\n/).forEach(function(l){ var m=head.exec(l.trim());
    if(m){ cur={when:m[1], by:m[2].trim(), lines:[m[3]]}; msgs.push(cur); } else { if(!cur){ cur={when:'', by:'', lines:[]}; msgs.push(cur); } cur.lines.push(l); } });
  var counts=[], notes=[], skipped=[];
  msgs.forEach(function(msg){
    var time=(/(\d{1,2}:\d\d)/.exec(msg.when)||[])[1]||'', day=normDay(msg.when)||todayStr(), c=null;
    msg.lines.forEach(function(raw){ var l=raw.trim(); if(!l) return;
      var n=l.replace(/[״"'׳`]/g,'').replace(/\s+/g,' ');
      var hm=/^(.+?) (יציאה למתקן|כניסה|יציאה|סוף יום)$/.exec(n);
      if(hm){ var who=hm[1].replace(/\(.*?\)/g,'').trim();
        c={day:day, time:time, by:msg.by, point:POINT_OF[who]||'other', pointText:POINT_OF[who]?'':who, moment:hm[2], plate:(/(\d{5,})/.exec(hm[1])||[])[1]||'', v:{}};
        counts.push(c); return; }
      var nc=/^(.+?) ללא שינוי$/.exec(n);
      if(nc && POINT_OF[nc[1].trim()]){ c=null; counts.push({day:day, time:time, by:msg.by, point:POINT_OF[nc[1].trim()], pointText:'', moment:'כניסה', plate:'', v:{}, same:true}); return; }
      var vm=/^(\d{1,4}) ?(גמ|קמ|גר|קר)$/.exec(n);
      if(vm && c){ c.v[COUNT_KEY[vm[2]]]=+vm[1]; return; }
      var am=/^(5|2\.5) ?קג (\d{1,4}) (מלא|ריק)$/.exec(n);
      if(am && c){ c.v[(am[1]==='5'?'a5':'a25')+(am[3]==='מלא'?'m':'r')]=+am[2]; return; }
      if(n==='אמגזיות') return;
      if(/\d/.test(n) && c && c.day===day && !/[א-ת]{3,}.*[א-ת]{3,}/.test(n)){ skipped.push(l); return; }
      notes.push({day:day, time:time, by:msg.by, text:l}); });
  });
  counts.forEach(function(c){ c.kind='count'; c.src='wa'; c.at=atOf(c.day,c.time); });
  counts.forEach(function(c){ if(!c.same) return; var last=cBefore(c, countLog().concat(counts)).filter(function(x){ return !x.same || Object.keys(x.v).length; }).pop();
    if(last){ c.v=JSON.parse(JSON.stringify(last.v)); c.sameAs=last.day+' '+last.moment+(last.time?' '+last.time:''); } });
  counts=counts.filter(function(c){ return c.same || Object.keys(c.v).length; });
  counts.forEach(function(c){ c.id=countId(c)+(c.same?'-same':''); });
  notes.forEach(function(x){ x.kind='note'; x.src='wa'; x.at=atOf(x.day,x.time); x.id='N'+x.day.replace(/\D/g,'')+'-'+(x.time||'')+'-'+x.text.slice(0,30); });
  return {counts:counts, notes:notes, skipped:skipped};
}
function cName(c){ return (c.point==='other' ? (c.pointText||'נקודה') : POINTS[c.point])+(c.plate?' ('+c.plate+')':'')+' '+c.moment; }
function cVals(v){ var L=[]; CF.forEach(function(f){ if(v[f.k]) L.push(v[f.k]+' '+f.l); }); Object.keys(AMG_LBL).forEach(function(k){ if(v[k]) L.push(AMG_LBL[k]+' '+v[k]); }); return L.join(' · ')||'הכל 0'; }
/* the four main kinds: a missing line is 0. Amgaz: compared only when both counts have them (often not counted at all) */
function hasAmg(v){ return Object.keys(AMG_LBL).some(function(k){ return v[k]!=null; }); }
function cDiff(a,b){ var L=[], amg=hasAmg(a)&&hasAmg(b); CF.map(function(f){ return [f.k,f.l]; }).concat(amg?Object.keys(AMG_LBL).map(function(k){ return [k,AMG_LBL[k]]; }):[]).forEach(function(p){
  var d=(b[p[0]]||0)-(a[p[0]]||0); if(d) L.push(p[1]+' '+(d>0?'+':'−')+Math.abs(d)); }); return L.join(' · '); }
function cBefore(c,L){ return (L||countLog()).filter(function(x){ return x.kind==='count' && x.point===c.point && (x.pointText||'')===(c.pointText||'') && x.day!==c.day && x.at<c.at; }); }
function cCompareHtml(c,L){
  var b=cBefore(c,L), last=b[b.length-1], same=b.filter(function(x){ return x.moment===c.moment; }).pop(), out='';
  if(last){ var d=cDiff(last.v,c.v), warn=d && c.moment==='כניסה' && c.point==='ramp';
    out+='<div style="font-size:13px;'+(warn?'color:var(--bad);font-weight:800':'')+'">'+(d?(warn?'⚠ ':'')+'מאז ':'✓ כמו ')+'הספירה האחרונה ('+esc(last.day.slice(0,5)+' '+last.moment+(last.time?' '+last.time:''))+')'+(d?': '+esc(d):'')+'</div>'; }
  if(same && same!==last){ var d2=cDiff(same.v,c.v); out+='<div class="muted" style="font-size:13px">לעומת '+esc(c.moment)+' ב־'+esc(same.day.slice(0,5))+': '+esc(d2||'אותו דבר')+'</div>'; }
  if(!last) out+='<div class="muted" style="font-size:13px">אין ספירה קודמת של הנקודה הזאת.</div>';
  return out;
}
function cRow(c,L){ return '<div style="border-bottom:1px solid var(--line);padding:6px 0"><div><b>'+esc(cName(c))+(c.same?' — ללא שינוי':'')+'</b> <span class="muted num" style="font-size:13px">'+esc((c.time||'')+(c.by?' · '+c.by:''))+'</span></div>'+
  (c.same && !Object.keys(c.v).length ? '<div class="note" style="font-size:13px">אין ספירה קודמת של המשאית הזאת באפליקציה, אז לא ידוע מה עליה. ספרו אותה פעם אחת (״+ ספירה חדשה״ ← ״משאית שניה״), ומשם זה יעבוד לבד.</div>'
    : '<div class="num" style="font-size:14px">'+esc(cVals(c.v))+(c.same && c.sameAs?' <span class="muted" style="font-size:12px">(כמו '+esc(c.sameAs)+')</span>':'')+'</div>'+(c.same?'':cCompareHtml(c,L)))+'</div>'; }
/* the Ofakim morning balance: everything counted coming in (ramp + trucks) against everything counted going out.
   Only Eyal's warehouse counts (pasted from WhatsApp) — not the driver's own counts at the facility. A point counted
   only coming in, or only going out, is what makes a gap — then the gap is what was on it. */
function ofakimBalance(day,L){
  var C=L.filter(function(x){ return x.kind==='count' && x.src==='wa' && x.day===day; }), ins={}, outs={};
  C.forEach(function(x){ var k=x.point+(x.pointText||''); if(x.moment==='כניסה') ins[k]=x; else if(x.moment==='יציאה'||x.moment==='יציאה למתקן') outs[k]=x; });
  var ik=Object.keys(ins), ok=Object.keys(outs); if(ik.length<2 || ok.length<2) return '';
  if(ik.some(function(k){ return ins[k].same && !Object.keys(ins[k].v).length; })) return '<div class="note" style="font-size:13px">⚖ בדיקת האיזון באופקים תעבוד אחרי שתהיה ספירה אחת של המשאית השנייה.</div>';
  /* a truck that did not change (counted only coming in, "ללא שינוי") left with the same — both sides */
  ik.forEach(function(k){ if(ins[k].same && !outs[k]) outs[k]=ins[k]; });
  /* a truck counted only going out ("נדיר יציאה למתקן") came in with what it had at its last count before today (e.g. the driver's end-of-day count) */
  var fromLast=[]; ok.forEach(function(k){ if(ins[k]) return; var last=cBefore(outs[k], L).pop(); if(last){ ins[k]=last; fromLast.push(cName(outs[k]).replace(/ (יציאה למתקן|יציאה)$/,'')+' ← '+last.day.slice(0,5)+' '+last.moment+(last.time?' '+last.time:'')); } });
  var sum=function(o){ var t={gm:0,km:0,gr:0,kr:0}; Object.keys(o).forEach(function(k){ CF.forEach(function(f){ t[f.k]+=o[k].v[f.k]||0; }); }); return t; };
  var a=sum(ins), b=sum(outs), d=cDiff(a,b), lone=ik.filter(function(k){ return !outs[k]; }).map(function(k){ return cName(ins[k]); }).concat(ok.filter(function(k){ return !ins[k]; }).map(function(k){ return cName(outs[k]); }));
  var tot=function(t){ return CF.map(function(f){ return t[f.k]+' '+f.l; }).join(' · '); };
  return '<div class="'+(d?'note':'okbox')+'" style="font-size:13.5px"><b>⚖ איזון הבוקר באופקים</b> — נכנס: '+esc(tot(a))+' · יצא: '+esc(tot(b))+'<br>'+
    (d ? '⚠ '+esc(d.replace(/\+/g,'יצא יותר ').replace(/−/g,'יצא פחות '))+
        (fromLast.length?'<br><span style="font-weight:400">כניסה לפי הספירה האחרונה: '+esc(fromLast.join(' · '))+'</span>':'')+(lone.length?'<br><span style="font-weight:400">נספר רק בצד אחד: '+esc(lone.join(' · '))+'. אם משאית לא נספרה בכניסה — הפער הוא מה שהיה עליה.</span>':'')
      : '✓ הכל מסתדר — כל בלון שנכנס יצא')+'</div>';
}
function countsLogCard(){
  var L=countLog(), t=todayStr(), today=L.filter(function(x){ return x.day===t; }), days=[];
  L.forEach(function(x){ if(x.day!==t && days.indexOf(x.day)<0) days.unshift(x.day); });
  return '<section class="card"><div class="sec" style="margin:0"><h3>📋 ספירות הבוקר — רמפה ומשאיות</h3><span class="muted num" style="font-size:13px">'+esc(t)+'</span></div>'+
    '<button class="btn btn-accent btn-sm" type="button" data-sheet="pastecounts">📋 הדבק ספירות מוואטסאפ</button>'+
    ofakimBalance(t,L)+(today.length ? today.map(function(x){ return x.kind==='note' ? '<div class="note" style="font-size:14px">📝 '+esc(x.text)+(x.time?' <span class="muted">'+esc(x.time)+'</span>':'')+'</div>' : cRow(x,L); }).join('')
      : '<p class="hint">עוד אין ספירות היום. מעתיקים מוואטסאפ את ההודעות של אייל (לחיצה ארוכה, לסמן את כולן, העתק) ומדביקים כאן.</p>')+
    (days.length ? '<details class="amg"><summary>ימים קודמים</summary>'+days.slice(0,14).map(function(d){
      return '<div style="margin-top:8px"><b>'+esc(weekday(d)+' · '+d)+'</b>'+L.filter(function(x){ return x.day===d; }).map(function(x){ return x.kind==='note' ? '<div class="hint">📝 '+esc(x.text)+'</div>' : '<div style="font-size:14px"><b>'+esc(cName(x))+'</b> <span class="muted">'+esc(x.time||'')+'</span> · <span class="num">'+esc(cVals(x.v))+'</span></div>'; }).join('')+'</div>'; }).join('')+'</details>' : '')+
  '</section>';
}
function pasteSheet(){
  draft={parsed:null};
  return '<h2>📋 הדבקת ספירות מוואטסאפ</h2>'+
    '<p class="hint">בוואטסאפ: לחיצה ארוכה על ההודעה הראשונה של אייל, לסמן את כל ההודעות של הספירה, ״העתק״ — ולהדביק כאן. אפשר גם הודעה אחת.</p>'+
    '<textarea class="inp" id="pasteTxt" style="min-height:160px" placeholder="[5:57, 4.10.2026] אייל: רמפה כניסה&#10;44 גמ&#10;76 ק״מ …"></textarea>'+
    '<button class="btn btn-ghost btn-sm" type="button" id="pasteRead">קרא</button><div id="pasteOut"></div>'+
    '<button class="btn btn-ghost btn-sm" type="button" data-close>ביטול</button>';
}
function pasteRead(){
  var p=parseCounts(document.getElementById('pasteTxt').value), L=countLog(), box=document.getElementById('pasteOut'); draft.parsed=p;
  if(!p.counts.length && !p.notes.length){ box.innerHTML='<p class="err">לא מצאתי ספירות. כל ספירה מתחילה בשורה כמו ״רמפה כניסה״ ואחריה ״44 גמ״.</p>'; return; }
  var tmp=L.concat(p.counts);
  box.innerHTML='<div class="okbox">נמצאו '+p.counts.length+' ספירות'+(p.notes.length?' ו־'+p.notes.length+' הערות':'')+'</div>'+
    p.counts.map(function(c){ return cRow(c,tmp); }).join('')+p.notes.map(function(x){ return '<div class="note" style="font-size:14px">📝 '+esc(x.text)+'</div>'; }).join('')+
    (p.skipped.length?'<p class="err">לא הבנתי: '+esc(p.skipped.join(' | '))+'</p>':'')+
    '<button class="btn btn-ok" type="button" id="pasteSave">שמור</button>';
}
async function syncCountLog(){
  if(typeof bot==='undefined' || !BOT_API || bot.status!=='active') return;
  try{
    var d=lsGet('gazgal-countlog-dirty',[]);
    if(d.length){ var L=countLog(), items=L.filter(function(x){ return d.indexOf(x.id)>=0; });
      var r=await botFetch('/api/counts',{method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({items:items})});
      if(r.ok) lsSet('gazgal-countlog-dirty', lsGet('gazgal-countlog-dirty',[]).filter(function(id){ return d.indexOf(id)<0; })); }
    var since=+lsGet('gazgal-countlog-since',0)||0, g=await botFetch('/api/counts?since='+since); if(!g.ok) return;
    var j=await g.json(); if((j.items||[]).length){ var have={}, L2=countLog(); L2.forEach(function(x){ have[x.id]=1; });
      j.items.forEach(function(x){ if(!have[x.id]) L2.push(x); }); lsSet('gazgal-countlog', L2.sort(function(a,b){ return a.at-b.at; })); }
    lsSet('gazgal-countlog-since', j.now||Date.now());
  }catch(e){}
}

/* ---------- ניהול צי (01/10): the driver's side — km, fuel, faults, emergency numbers ----------
   Reports wait in the phone and go to the server when there is signal; the phone makes the id, so a resend never
   writes twice. The office page keeps the dates and the garage log. The emergency numbers and the truck's insurance
   policies are kept in the phone, so they open in a dead zone too. */
var FUEL_SRC=['מיכל אופקים','מיכל רמת חובב','תחנת דלק'];
var FAULTS=['פנצ׳ר / צמיג','נורת אזהרה','בלמים','תאורה','דליפה','מנוף / הרמה','תאונה','אחר'];
function fleetCache(){ return lsGet('gazgal-fleet',{vehicles:[],emergency:[]}); }
function vehicleOf(plate){ return (fleetCache().vehicles||[]).filter(function(v){ return v.plate===plate; })[0] || null; }
function fleetQueue(kind,plate,data,photo){
  var id='fl-'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
  data.at=data.at||Date.now(); if(photo) data.photo=true;
  return idbGet('kv','fleetOut').then(function(q){ q=q||[]; q.push({id:id, kind:kind, plate:plate, data:data, photo:photo||null}); return idbPut('kv','fleetOut',q); })
    .then(function(){ syncFleet(true); }).catch(function(){});
}
var fleetBusy=false;
async function syncFleet(sendOnly){
  if(typeof bot==='undefined' || !BOT_API || bot.status!=='active' || fleetBusy) return; fleetBusy=true;
  try{
    var q=(await idbGet('kv','fleetOut'))||[], left=[];
    for(var i=0;i<q.length;i++){ var it=q[i];
      try{ var r=await botFetch('/api/fleet/log',{method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({id:it.id, kind:it.kind, plate:it.plate, data:it.data})});
        if(!r.ok) throw 0;
        if(it.photo){ var b=await (await fetch(it.photo)).blob(), pr=await botFetch('/api/fleet/photo/'+it.id,{method:'POST', headers:{'content-type':b.type||'image/jpeg'}, body:b}); if(!pr.ok) throw 0; }
      }catch(e){ left=q.slice(i); break; } }
    await idbPut('kv','fleetOut',left);
    if(!sendOnly && (!bot.fleetAt || Date.now()-bot.fleetAt>10*60000)){ var g=await botFetch('/api/fleet'); if(g.ok){ lsSet('gazgal-fleet', await g.json()); bot.fleetAt=Date.now(); } }
  }catch(e){}
  fleetBusy=false;
}
/* what the driver must know about his truck today: a test or an insurance that ran out (UC-20: such a truck should not go out) */
function vehicleAlerts(plate){
  var v=vehicleOf(plate), out=[]; if(!v) return out;
  var today=isoOf(todayStr());
  ((v.data||{}).items||[]).forEach(function(it){ if(it.everyKm || !it.due) return;
    var n=Math.round((new Date(it.due+'T12:00')-new Date(today+'T12:00'))/864e5);
    if(n<0) out.push({bad:true, t:it.l+' פג ב־'+fmtD(it.due)}); else if(n<=7 && /טסט|ביטוח/.test(it.l)) out.push({bad:false, t:it.l+' — עוד '+n+' ימים ('+fmtD(it.due)+')'}); });
  return out;
}
function fleetBtns(){
  var al=vehicleAlerts(state.truck||myPlate());
  return (al.length?'<div class="note"'+(al.some(function(a){ return a.bad; })?' style="color:var(--bad)"':'')+'>⚠ משאית '+esc(state.truck||myPlate())+': '+esc(al.map(function(a){ return a.t; }).join(' · '))+' — לדבר עם המשרד</div>':'')+
    '<div class="grid2" style="grid-template-columns:repeat(3,1fr)"><button class="btn btn-ghost btn-sm" type="button" data-sheet="fuel">⛽ תדלוק</button><button class="btn btn-ghost btn-sm" type="button" data-sheet="fault">🔧 תקלה</button><button class="btn btn-ghost btn-sm" type="button" data-sheet="sos" style="color:var(--bad);border-color:var(--bad)">🆘 חירום</button></div>';
}
function plateField(){ return '<div class="field"><label for="flPlate">משאית (מספר רישוי)</label><input class="inp num" id="flPlate" inputmode="numeric" autocomplete="off" value="'+esc(myPlate())+'"></div>'; }

  return '<h2>⛽ תדלוק</h2>'+plateField()+

/* Column bands by the right edge of each text run, on an A4 page 595pt wide. Measured on a real journal. */

async function importPdf(file, append){

    var check={count:res.stops.length, total:Math.round(tot*100)/100, rCount:res.sum.count, rTotal:res.sum.total,
      itemsMissing:res.stops.filter(function(x){ return !x.items.length; }).length};
    check.ok = (check.rCount==null || check.rCount===check.count) && (check.rTotal==null || Math.abs(check.rTotal-check.total)<0.05) && !check.itemsMissing;
    var jno=res.meta.journal||'—';

      if(!state.journals.some(function(j){ return j.no===jno; })) state.journals.push({no:jno, date:res.meta.date||'', driver:res.meta.driver||'', check:check});
      state.stops=state.stops.concat(fresh2);

      toast('יומן '+jno+': נוספו '+fresh2.length+' הזמנות'+(skipped?' · '+skipped+' כבר היו':''));
      if(!fresh2.length){ render(); return true; }

      return true;
    }
    state=migrate({source:'pdf', journal:jno, date:res.meta.date||'', driver:res.meta.driver||'נהג', check:check,
      journals:[{no:jno, date:res.meta.date||'', driver:res.meta.driver||'', check:check}],

    return true;
  }catch(e){

    try{ console.error(e); }catch(_){}

  }

/* 🚨 urgent: this stop goes next from wherever the driver is, and everything else is re-ordered from ITS location */
async function urgentRoute(id){
  var s=byId(id); if(!s) return;
  var arr=state.stops, c=cur(); arr.splice(arr.indexOf(s),1); arr.splice(c?arr.indexOf(c):arr.length,0,s);
  closeSheet(); save(); render(); window.scrollTo(0,0); toast('🚨 '+s.name+' — העצירה הבאה. מסדר את השאר ממנה…');
  try{
    var L=await locate(s); if(!L.p){ toast('🚨 '+s.name+' — הבאה (לא נמצאה במפה, השאר בלי שינוי)'); return; }
    var rest=routePending().filter(function(x){ return x!==s; }), rest1=others().filter(function(x){ return x!==s; }), located=[], missing=[];
    for(var i=0;i<rest.length;i++){ var l2=rest[i].pt!==undefined ? {p:rest[i].pt} : await locate(rest[i]); rest[i].pt=l2.p||null; if(l2.p) located.push({s:rest[i], p:l2.p}); else missing.push(rest[i]); }
    var r=optimize(L.p, located);
    state.stops=done().concat([s], r.path.map(function(x){ return x.s; }), missing, rest1); save(); render();
    toast('🚨 '+s.name+' הבאה, והשאר מסודר מהמקום שלה');
  }catch(e){ toast('🚨 '+s.name+' — הבאה (אין גישה למפה, השאר בלי שינוי)'); }
}

/* ================= the office bot: messages the office sends to the GazGal WhatsApp number =================
   The server only relays (see server/ in the repo). This phone pulls new messages every 30 s while the app is open,
   reads the screenshot itself (readCard above), and tells the bot what the driver did so the office gets an answer.
   The phone is connected once: it makes a random key, and the driver approves it by sending "חבר 1234" to the bot. */
var BOT_API = location.hostname==='localhost' ? 'http://localhost:8787' : 'https://bot.gazgal.com';
var BOT_KEY_LS='gazgal-bot-key', INBOX_LS='gazgal-inbox';
var bot={status:'off', inbox:[], polling:null, ackId:null, name:''};
try{ bot.inbox=JSON.parse(localStorage.getItem(INBOX_LS)||'[]')||[]; }catch(e){ bot.inbox=[]; }
try{ bot.status=localStorage.getItem('gazgal-bot-status')||'off'; }catch(e){}
function botKey(){
  var k=null; try{ k=localStorage.getItem(BOT_KEY_LS); }catch(e){}
  if(!k){ var a=new Uint8Array(32); crypto.getRandomValues(a); k=[].map.call(a,function(b){ return ('0'+b.toString(16)).slice(-2); }).join(''); try{ localStorage.setItem(BOT_KEY_LS,k); }catch(e){} }
  return k;
}
function botFetch(path,opt){ opt=opt||{}; opt.headers=Object.assign({authorization:'Bearer '+botKey()}, opt.headers||{}); return fetch(BOT_API+path,opt); }
function setBotStatus(s){ bot.status=s; try{ localStorage.setItem('gazgal-bot-status',s); }catch(e){} }
function saveInbox(){ try{ localStorage.setItem(INBOX_LS, JSON.stringify(bot.inbox.slice(-60))); }catch(e){} }
function newCount(){ return bot.inbox.filter(function(m){ return m.status==='new'; }).length; }
/* FEEDBACK #35: a message stays "waiting" until the driver did something with it — added, cancelled or closed as handled.
   Opening it is not enough. Only the last 18 hours, so yesterday's leftovers do not nag. */
function openMsgs(){ var since=Date.now()-18*3600e3; return bot.inbox.filter(function(m){ return (m.status==='new'||m.status==='seen') && (m.received||0)>since; }); }
async function pollInbox(quiet,force){
  if(!BOT_API || bot.status!=='active' || (document.hidden && !force)) return;
  try{
    var last=bot.inbox.reduce(function(t,m){ return Math.max(t,m.received||0); },0);
    var r=await botFetch('/api/inbox'+(last?'?since='+(last-1):''));
    if(r.status===401||r.status===403){ setBotStatus('off'); render(); return; }
    var j=await r.json(), before=newCount(), fresh=0;
    (j.messages||[]).forEach(function(m){ var i=bot.inbox.findIndex(function(x){ return x.id===m.id; });
      if(i<0){ bot.inbox.push(m); if(m.status==='new') fresh++; } else bot.inbox[i]=Object.assign(bot.inbox[i], {status:m.status, result:m.result}); });
    saveInbox();
    if(fresh && !quiet){ toast('📥 '+(fresh>1?fresh+' הודעות חדשות':'הודעה חדשה')+' מהמשרד'); try{ navigator.vibrate && navigator.vibrate([180,80,180]); }catch(e){} }
    if(newCount()!==before && !document.querySelector('.scrim')) render();
  }catch(e){ /* no signal — try again next time */ }
}
function startPolling(){ if(bot.polling) clearInterval(bot.polling); if(!BOT_API || bot.status!=='active') return; pollInbox(true); pollMore(); checkRestore(); sendLive(); syncDn(); bot.polling=setInterval(function(){ pollInbox(); pollMore(); }, 30000);
  if(bot.liveTimer) clearInterval(bot.liveTimer); bot.liveTimer=setInterval(function(){ if(!document.hidden) sendLive(); }, 180000); }

/* ---- FEEDBACK #40: customers call the office "מתי הנהג מגיע?". The office page shows where the route is: what was
   done and when, what is next, and an estimate per stop. Sent after every change and every 3 minutes while the app
   is open. Location only if the driver allowed it (a switch in the bot card), and only while on the route.
   No phones — name, customer number, town and street, which the office has in Bashan anyway. Since 01/10 (office
   feedback מ2, Nadir's decision) also each order's amount and what was received, and the driver's notes (מ1). ---- */
function shareLoc(){ try{ return localStorage.getItem('gazgal-share-loc')!=='0'; }catch(e){ return true; } }
function liveAvg(){   /* minutes per stop, from today's gaps between deliveries (median), 5–25, else 12 */
  var ts=state.stops.map(function(x){ return x.result && x.result.at; }).filter(Boolean).sort(), g=[];
  for(var i=1;i<ts.length;i++){ var m=(ts[i]-ts[i-1])/60000; if(m>0.5 && m<60) g.push(m); }
  if(g.length<2) return 12; g.sort(function(a,b){ return a-b; }); return Math.max(5, Math.min(25, Math.round(g[Math.floor(g.length/2)])));
}
/* driving minutes between two points: straight line × 1.35 for the roads, at 45 km/h (towns and moshavim) */
function driveMin(a,b){ return Math.max(2, Math.round(dist(a,b)*1.35/45*60)); }
/* minutes at a stop (parking, cylinders, payment) — today's gaps minus the driving between them; 7 until there are enough */
function liveSvc(){
  var d=state.stops.filter(function(x){ return x.result && x.result.at; }).sort(function(a,b){ return a.result.at-b.result.at; }), g=[];
  for(var i=1;i<d.length;i++){ if(!d[i].pt || !d[i-1].pt) continue; var m=(d[i].result.at-d[i-1].result.at)/60000-driveMin(d[i-1].pt,d[i].pt); if(m>0 && m<45) g.push(m); }
  if(g.length<2) return 7; g.sort(function(a,b){ return a-b; }); return Math.max(3, Math.min(20, Math.round(g[Math.floor(g.length/2)])));
}
function livePayload(pos){
  var pend=routePending().concat(others()), tn=truckNow(), svc=liveSvc(), avg=liveAvg();
  /* the stop the driver last left for (Waze) goes first */
  var lastAt=state.stops.reduce(function(m,x){ var a=x.result && x.result.at; return a>m ? a : m; },0);
  var go=pend.filter(function(x){ return x.leftAt && x.leftAt>lastAt; }).sort(function(a,b){ return b.leftAt-a.leftAt; })[0];
  if(go){ pend.splice(pend.indexOf(go),1); pend.unshift(go); }
  var prev=state.stops.filter(function(x){ return x.status==='delivered' && x.pt && x.result && x.result.at; }).sort(function(a,b){ return b.result.at-a.result.at; })[0];
  var prevPt = pos ? [pos.lat,pos.lon] : prev ? prev.pt : null;
  var row=function(x,st){ var r=x.result||{}, py=r.payment, o={c:custNo(x), n:x.name, a:addr(x), t:x.city, hd:x.hood||undefined, pt:x.point||'', o:x.orderNo||(x.hot?'':x.id), s:st, at:r.at||0, why:st==='failed'?(r.reason||''):'',
    q:[qtyOf(x,'1',st==='done'), qtyOf(x,'2',st==='done')], k:x.kind==='task'?'task':undefined, tk:x.kind==='task'?String(x.task||'').slice(0,90):undefined, sv:x.kind==='task'?(x.dur||20):undefined};
    /* office feedback מ2: the order's amount and what was received · מ4: a discount · מ1: the driver's note to the office */
    o.md=mode(x); o.m = x.kind==='task' ? (x.taskAmt||0) : totalOf(x, st==='done'); if(x.kind==='task') o.tp=x.taskPay||'';
    if(st==='done' && py) o.py={k:py.method, a:py.amount||0, f:payForText(py)||undefined};
    if(r.disc) o.ds={l:r.disc.list, p:r.disc.price, r:r.disc.reason};
    var nt=[st==='failed'?[r.safety,r.text].filter(Boolean).join(' — '):'',x.kind==='task'&&r.done?'בוצע: '+r.done:'', x.officeNote||''].filter(Boolean).join(' · ');
    if(nt) o.nt=nt.slice(0,300);
    if(x.dn) o.dn=dnNo(x.dn.no);
    return o; };
  var next=pend.map(function(x){ var o=row(x,'next'); o.d = prevPt && x.pt ? driveMin(prevPt,x.pt) : Math.max(3, avg-svc); prevPt=x.pt||null; return o; });
  return { day:dayOf(), phase:state.phase, driver:state.driver, journals:journalNos(), avg:avg, svc:svc, go:go?go.leftAt:0,
    lastAt:lastAt,
    stops: done().slice().sort(function(a,b){ return ((a.result||{}).at||0)-((b.result||{}).at||0); }).map(function(x){ return row(x, x.status==='delivered'?'done':'failed'); })
      .concat(next),
    truck: tn ? tn.v : null, plate: state.truck||'', pos: pos||null };
}
function scheduleLive(){ if(typeof bot==='undefined' || !bot || bot.status!=='active' || state.source!=='pdf') return; clearTimeout(scheduleLive.t); scheduleLive.t=setTimeout(sendLive, 6000); }
async function sendLive(closed){
  if(!BOT_API || bot.status!=='active' || state.source!=='pdf' && !closed) return;
  var pos=null;
  if(!closed && state.phase==='route' && shareLoc()) pos=await livePos();
  try{ await botFetch('/api/live',{method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify(closed ? {closed:true} : livePayload(pos))}); }catch(e){}
}
/* never asks for permission here — only uses it if the driver already allowed location for the app */
async function livePos(){
  try{ if(navigator.permissions){ var st=await navigator.permissions.query({name:'geolocation'}); if(st.state!=='granted') return null; } }catch(e){ return null; }
  /* high accuracy = the GPS itself. Without it the phone may answer from cell towers, hundreds of metres to kilometres off */
  return new Promise(function(res){ try{ navigator.geolocation.getCurrentPosition(function(p){ res({lat:Math.round(p.coords.latitude*1e5)/1e5, lon:Math.round(p.coords.longitude*1e5)/1e5, acc:Math.round(p.coords.accuracy), at:p.timestamp||Date.now()}); },
    function(){ res(null); }, {enableHighAccuracy:true, maximumAge:15000, timeout:20000}); }catch(e){ res(null); } });
}

    botFetch('/api/request',{method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({id:s.reqId, text:reqText(s)})})
      .then(function(r){ if(r.ok){ s.reqSent=true; save(); } }).catch(function(){}); });

async function pollRequests(){

  try{ var r=await botFetch('/api/requests'); if(!r.ok) return; var rs=(await r.json()).requests||[], changed=false;
    rs.forEach(function(q){ var s=state.stops.filter(function(x){ return x.reqId===q.id && x.needsOk; })[0]; if(!s || q.status==='pending') return;
      var qa=null; if(/^\{/.test(q.answer||'')){ try{ qa=JSON.parse(q.answer); }catch(e){} }
      if(q.status==='approved'){ s.needsOk=false; s.okBy=q.answered_by||'המשרד';

          if(fx.city) s.city=fx.city; if(fx.phone){ s.phones=s.phones||['','']; if(s.phones.indexOf(fx.phone)<0) s.phones=[fx.phone].concat(s.phones.filter(Boolean)).slice(0,2); }
          if(fx.note) s.note=(s.note?s.note+' · ':'')+'משרד: '+fx.note; s.officeFixed=true; if(fx.street||fx.city){ delete s.pt; delete s.hood; } }

  }catch(e){}

/* FEEDBACK #31 / #39: what is on the truck right now — full and empty. It starts from the LAST count of the truck
   ("יצאתי מהמתקן עם 24 גדולים ו־49 קטנים") and follows everything after it: every delivery takes full ones off and
   puts empties (and returned loaned cylinders) on, every warehouse / facility stop adds or removes.
   With no count today, it starts from yesterday's balance, the same as the end-of-day reconciliation. */
function truckNow(){
  var mine=state.counts.filter(function(c){ return c.point===ME() && idMs(c); }), last=mine[mine.length-1];
  if(!last){ var ex=report().exp; return ex ? {v:ex, from:'מהיתרות של אתמול', n:done().filter(function(x){ return x.status==='delivered'; }).length} : null; }
  var t=idMs(last), v={gm:last.v.gm||0, km:last.v.km||0, gr:last.v.gr||0, kr:last.v.kr||0}, n=0;
  (state.facility||[]).forEach(function(f){ if(idMs(f)>t){ var d=moveOf(f); CF.forEach(function(x){ v[x.k]+=d[x.k]; }); } });
  state.stops.forEach(function(x){ var r=x.result; if(x.status!=='delivered' || !r || !(r.at>t)) return; n++;
    v.km-=qtyOf(x,'1',true); v.gm-=qtyOf(x,'2',true);
    v.kr+=(r.empties[1]||0)+((r.loan||{})[1]||0); v.gr+=(r.empties[2]||0)+((r.loan||{})[2]||0); });
  return {v:v, from:'מספירת "'+last.moment+'" '+last.time, n:n};
}

/* split the appendix table over as many A4 pages as it needs, repeating the header */
function paginate(root){
  [].slice.call(root.querySelectorAll('.paper.flow')).forEach(function(pg){
    var cur=pg, before=null, guard=0;
    while(cur.scrollHeight>cur.clientHeight+1 && guard++<40){
      var tb=cur.querySelector('tbody'); if(tb.children.length<2) break;
      var nx=cur.cloneNode(true), ntb=nx.querySelector('tbody'); ntb.innerHTML='';
      var foot=cur.querySelector('.foot'), limit=foot.getBoundingClientRect().top-6;
      while(tb.children.length>1 && tb.lastElementChild.getBoundingClientRect().bottom>limit){ ntb.insertBefore(tb.lastElementChild, ntb.firstChild); }
      /* a journal's title row goes with its orders, never alone at the bottom of a page */
      while(tb.children.length>1 && tb.lastElementChild.classList.contains('grp')){ ntb.insertBefore(tb.lastElementChild, ntb.firstChild); }
      if(!ntb.children.length) break;
      cur.parentNode.insertBefore(nx, cur.nextSibling); before=cur; cur=nx;
    }
    /* no last page with one or two lonely orders: move a few more over from the page before */
    if(before){ var lt=cur.querySelector('tbody'), bt=before.querySelector('tbody');
      while(lt.children.length<4 && bt.children.length>6){ lt.insertBefore(bt.lastElementChild, lt.firstChild); }
      while(bt.children.length>1 && bt.lastElementChild.classList.contains('grp')){ lt.insertBefore(bt.lastElementChild, lt.firstChild); } }
  });
  var all=root.querySelectorAll('.paper');
  [].slice.call(all).forEach(function(p,i){ var pg=p.querySelector('.pg'); if(pg) pg.textContent='עמוד '+(i+1)+' מתוך '+all.length; });
}

/* FEEDBACK #33: the closed day waits here (in the phone) until there is signal, then goes to the office page and
   stays on the server for 90 days — so a broken phone loses nothing. */
function outbox(){ return idbGet('kv','outbox').then(function(x){ return x||[]; }).catch(function(){ return []; }); }
var flushing=false;
/* every closed day in the phone's archive that never reached the office joins the outbox (the first days were closed
   before the server took reports) — so the office's history is complete */
async function backfillOutbox(){
  if(!BOT_API || bot.status!=='active' || backfillOutbox.done) return; backfillOutbox.done=true;
  try{ var idx=await dayIndex(), ob=await outbox(), add=0;
    for(var i=0;i<idx.length;i++){ var x=idx[i]; if(x.sent || ob.some(function(o){ return o.id===x.id; })) continue;
      var rec=await idbGet('days', x.id); if(!rec) continue; migrateRec(rec);
      var meta=withDay(rec.day, rec.photos||{}, function(){ var R=report(); return {id:x.id, iso:isoOf(dayOf()), date:dayOf(), journals:journalNos(), driver:state.driver, del:R.del.length, n:state.stops.length,
        cash:R.t.cash, cheque:R.t.cheque, nq:R.t.nq, later:R.t.later, unpaid:R.t.unpaid, handover:state.handover, gap:hoGap(R), text:reportText(R)}; });
      ob.push({id:x.id, meta:meta}); add++; }
    if(add){ await idbPut('kv','outbox',ob); flushOutbox(); }
  }catch(e){ backfillOutbox.done=false; }
}
async function flushOutbox(){
  if(flushing || !BOT_API || bot.status!=='active') return; flushing=true;
  try{
    var ob=await outbox();
    for(var i=0;i<ob.length;i++){ var it=ob[i], rec=await idbGet('days', it.id); if(!rec){ it.gone=true; continue; }
      if(!it.pdf){ try{ it.pdf=await pdfBlob(migrateRec(rec)); await idbPut('kv','outbox',ob); }catch(e){} }
      var fd=new FormData(); fd.append('meta', JSON.stringify(it.meta)); fd.append('snap', JSON.stringify(rec.day)); if(it.pdf) fd.append('pdf', it.pdf, pdfName(rec));
      var r=await botFetch('/api/report',{method:'POST', body:fd}).catch(function(){ return null; });
      if(r && r.ok){ it.sent=Date.now(); var idx=await dayIndex(); idx.forEach(function(x){ if(x.id===it.id) x.sent=it.sent; }); await idbPut('kv','dayIndex',idx);
        if(!document.querySelector('.scrim') && state.view==='history') fillHistory(); toast('☁ הדוח של '+it.meta.date+' הגיע למשרד'); }
      else break;   /* no signal — the rest waits too */
    }
    await idbPut('kv','outbox', ob.filter(function(x){ return !x.sent && !x.gone; }));
  }catch(e){}
  flushing=false;
}

function dayIndex(){ return idbGet('kv','dayIndex').then(function(x){ return x||[]; }); }
async function closeDay(){
  payRows=null;
  var mem=state.memory, start=state.start;
  if(state.source==='pdf'){
    var R=report(), id=isoOf(dayOf())+'-'+state.journal;
    var snap=JSON.parse(JSON.stringify(state)); delete snap.memory; snap.prevEve=R.prev||null; snap.closedAt=new Date().toISOString();
    var ph={}; Object.keys(photos).forEach(function(k){ ph[k]=photos[k]; });
    var summ={id:id, iso:isoOf(dayOf()), date:dayOf(), journals:journalNos(), driver:state.driver, del:R.del.length, n:state.stops.length, cash:R.t.cash, cheque:R.t.cheque, closedAt:snap.closedAt};
    await idbPut('days', id, {id:id, date:dayOf(), journals:summ.journals, day:snap, photos:ph});
    var idx=(await dayIndex()).filter(function(x){ return x.id!==id; }); idx.push(summ);
    var cut=new Date(Date.now()-KEEP_DAYS*864e5).toISOString().slice(0,10), old=idx.filter(function(x){ return x.iso<cut; });
    for(var i=0;i<old.length;i++){ await idbDel('days', old[i].id); }
    idx=idx.filter(function(x){ return x.iso>=cut; }).sort(function(a,b){ return a.id<b.id?1:-1; });
    await idbPut('kv','dayIndex',idx);
    var ob=(await outbox()).filter(function(x){ return x.id!==id; });
    ob.push({id:id, meta:{id:id, iso:summ.iso, date:summ.date, journals:summ.journals, driver:state.driver, del:summ.del, n:summ.n, cash:R.t.cash, cheque:R.t.cheque, nq:R.t.nq,
      later:R.t.later, unpaid:R.t.unpaid, handover:state.handover, gap:hoGap(R), text:reportText(R)}});
    await idbPut('kv','outbox',ob);
    /* no end-of-day count: the truck still gets a closing — what it should hold by the app — so tomorrow goes on from it */
    if(state.truck && !R.eve && R.exp) truckSave(state.truck, {id:'C'+Date.now(), v:R.exp, moment:'סוף יום (מחושב, בלי ספירה)', time:new Date().toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'})});
    if(R.eve){ try{ localStorage.setItem('gazgal-last-close', JSON.stringify({date:dayOf(), v:R.eve.v, journal:state.journal, plate:state.truck||''})); }catch(e){} }
  }
  state=migrate(fresh()); state.memory=mem; state.start=start; photos={}; savePhotos(); save();
  sendLive(true); setTimeout(flushOutbox, 1500);
}

function ordered(s,code){ return s.items.filter(function(i){ return i.code===code; }).reduce(function(t,i){ return t+i.qty; },0); }
function codesOf(c){ var cs=['1','2']; c.items.forEach(function(i){ if(cs.indexOf(i.code)<0) cs.push(i.code); }); (draft && draft.extra || []).forEach(function(k){ if(cs.indexOf(k)<0) cs.push(k); }); return cs; }
function labelFor(c,code){ var ex=c.items.filter(function(i){ return i.code===code; })[0]; return ex ? itemLabel(ex) : (ITEM_NAME[code]||code); }
function dPrice(c,code){ var ex=c.items.filter(function(i){ return i.code===code; })[0]; if(ex) return ex.price; return draft.price[code]!=null ? draft.price[code] : (prices[code]||priceOf(code)); }
function dItems(c){
  var out=[];
  codesOf(c).forEach(function(code){ var ex=c.items.filter(function(i){ return i.code===code; })[0];
    var qty=ex?ex.qty:0; if(qty || draft.q[code]) out.push({code:code, desc:ex?ex.desc:(ITEM_NAME[code]||code), qty:qty, price:dPrice(c,code), actual:draft.q[code]||0}); });
  return out;
}
/* the price list amount; dAmount is what is collected — lower only with a discount and its reason (office feedback מ4) */
function dBase(c){ return Math.round((totalOf({items:dItems(c), discGross:c.discGross}, true)+(draft && draft.extraAmt || 0))*100)/100; }
function dAmount(c){ var b=dBase(c), p=draft && draft.disc; return p!=null && p>=0 && p<b ? p : b; }

function discText(d){ return 'הנחה של '+money(Math.round((d.list-d.price)*100)/100)+': '+money(d.list)+' ← '+money(d.price)+' · '+d.reason; }

/* ================= FEEDBACK #45 / #46: the route follows the driver's choice =================
   ⤒ or dragging a stop keeps it where the driver put it and re-orders everything after it by the map, from it.
   A customer marked "🌅 בבוקר" (e.g. a restaurant in the old city — no parking later) goes first in the morning. */
function isAm(s){ return !!(s.am || (state.memory[s.cust]||{}).am); }
function amActive(){ return new Date().getHours()<11; }
function amBtn(s){
  if(s.status!=='pending') return '';
  return '<button class="linkish" type="button" data-am="'+esc(s.id)+'">'+(isAm(s)?'🌅 תמיד בבוקר — בטל':'🌅 סמן: תמיד בבוקר (למשל: אין חניה אחר כך)')+'</button>';
}
function routeOrder(start, located){
  var am=amActive() ? located.filter(function(x){ return isAm(x.s); }) : [], rest=located.filter(function(x){ return am.indexOf(x)<0; });
  if(!am.length) return optimize(start, located);
  var r1=optimize(start, am), r2=optimize(r1.path[r1.path.length-1].p, rest);
  return {path:r1.path.concat(r2.path), km:r1.km+r2.km, am:am.length};
}
async function rerouteAfter(s){
  var ps=routePending(), ix=ps.indexOf(s); if(ix<0 || ps.length-ix<3) return;

    .catch(function(e){ gm.textContent = e && e.message==='denied' ? 'אין הרשאת מיקום. בהגדרות הטלפון: מיקום דולק, והדפדפן מורשה להשתמש בו.' : 'לא התקבל GPS תוך 25 שניות. צא מהרכב, מתחת לשמיים פתוחים, ולחץ שוב.'; gm.style.color='var(--bad)'; });
    return; }
  if(ds.geoforce){ var cand=draft && draft.geoCand; if(cand){ acceptGeo(cand.pos, cand.acc); delete draft.geoCand; } return; }
  if(t.id==='goRoute'){ startRoute(false); return; }
  if(t.id==='goManual'){ startRoute(true); return; }
  if(t.id==='applyOrder'){
    var chosen=draft.seq.map(function(id){ return state.stops.filter(function(x){ return x.id===id; })[0]; }).filter(Boolean);
    var rest=routePending().filter(function(x){ return chosen.indexOf(x)<0; });
    state.stops=done().concat(chosen, rest, others());
    after(chosen.length ? 'הסדר עודכן' : null); return;
  }
  if(t.id==='saveCount'){ saveCount(); return; }
  if(t.id==='copyCount'){ var cm=draft && draft.savedMsg; if(!cm) return;
    try{ navigator.clipboard.writeText(cm).then(function(){ toast('הועתק — הדבק בקבוצה'); }, function(){ toast('ההעתקה נחסמה. השתמש ב״שלח לקבוצת הנהגים״.'); }); }catch(e){ toast('ההעתקה נחסמה. השתמש ב״שלח לקבוצת הנהגים״.'); }
    return; }
  if(t.id==='confirmDeliver'){ confirmDeliver(); return; }
  if(t.id==='confirmFail'){ confirmFail(); return; }
  if(t.id==='confirmSafety'){ confirmSafety(); return; }
  if(t.id==='confirmHot'){ confirmHot(); return; }
  if(t.id==='confirmReset'){ var wasReal=state.source==='pdf'; t.disabled=true;
    closeDay().then(function(){ after(wasReal?'✓ היום נסגר ונשמר ב״דוחות קודמים״. ייבא את היומן של מחר.':'יום חדש. ייבא את היומן.'); setTimeout(function(){ applyUpdate(true); },3000); })
      .catch(function(){ t.disabled=false; toast('השמירה בטלפון נכשלה — היום לא נמחק. נסה שוב.'); });
    return; }
  if(t.id==='copyRep'){
    var txt=reportText(report()), ta=document.getElementById('repText');
    var fb=function(){ ta.hidden=false; ta.value=txt; ta.style.minHeight='220px'; ta.focus(); ta.select(); toast('סמן את הטקסט והעתק'); };
    try{ navigator.clipboard.writeText(txt).then(function(){ toast('הדוח הועתק. הדבק אותו בוואטסאפ לפקידה.'); }, fb); }catch(e){ fb(); }
    return;
  }
});
/* drag to reorder the queue: press the ⠿ handle and move. Page coordinates, so the page can scroll while dragging. */
var drag=null;
document.addEventListener('pointerdown',function(ev){
  var h=ev.target.closest('[data-drag]'); if(!h) return;
  ev.preventDefault();
  var li=h.closest('.li'), items=[].slice.call(li.parentNode.children);
  drag={id:h.dataset.drag, li:li, items:items, from:items.indexOf(li), to:items.indexOf(li), y0:ev.pageY,
    mids:items.map(function(x){ var r=x.getBoundingClientRect(); return r.top+window.scrollY+r.height/2; }), h:li.getBoundingClientRect().height+8};
  li.classList.add('dragging'); items.forEach(function(x){ if(x!==li) x.classList.add('shift'); });
  try{ h.setPointerCapture(ev.pointerId); }catch(e){}
});
document.addEventListener('pointermove',function(ev){
  if(!drag) return; ev.preventDefault();
  if(ev.clientY<90) window.scrollBy(0,-12); else if(ev.clientY>window.innerHeight-150) window.scrollBy(0,12);
  var dy=ev.pageY-drag.y0, y=drag.mids[drag.from]+dy, to=0;
  drag.li.style.transform='translateY('+dy+'px)';
  drag.mids.forEach(function(m,i){ if(i!==drag.from && m<y) to++; });
  drag.to=to;
  drag.items.forEach(function(x,i){ if(x===drag.li) return;
    var sh = (drag.from<to && i>drag.from && i<=to) ? -drag.h : (to<drag.from && i>=to && i<drag.from) ? drag.h : 0;
    x.style.transform = sh ? 'translateY('+sh+'px)' : ''; });
});
function endDrag(){
  if(!drag) return; var d=drag; drag=null;
  if(d.to!==d.from){
    var ps=routePending(), head=ps[0], q=ps.slice(1), mv=q.splice(d.from,1)[0]; q.splice(d.to,0,mv);
    state.stops=done().concat([head], q, others()); save(); toast(mv.name+' הועבר למקום '+(done().length+d.to+2));
    state.lastMoved=mv.id; save(); render(); return;
  }
  render();
}
document.addEventListener('pointerup',endDrag);
document.addEventListener('pointercancel',endDrag);
document.addEventListener('input',function(ev){
  var t=ev.target; if(!draft) return;
  if(t.dataset && t.dataset.cin){
    var clean=t.value.replace(/\D/g,'').slice(0,4); if(clean!==t.value) t.value=clean;
    draft.v[t.dataset.cin]=clean ? parseInt(clean,10) : 0; t.classList.toggle('has', !!clean); updateCountMsg();
  }
  if(t.id==='cOther'){ draft.pointText=t.value.trim(); updateCountMsg(); }
  if(t.id==='cPlate'){ draft.plate=plateOk(t.value); document.querySelectorAll('[data-cplate]').forEach(function(b){ b.setAttribute('aria-pressed', b.dataset.cplate===draft.plate?'true':'false'); }); updateCountMsg(); }
  if(t.dataset && t.dataset.price){ draft.price[t.dataset.price]=parseFloat(String(t.value).replace(',','.'))||0; refreshAmt(); }
  if(t.id==='discPrice'){ var dv=parseFloat(String(t.value).replace(',','.')); draft.disc=(t.value.trim()==='' || isNaN(dv)) ? null : dv; refreshAmt(); }
});
document.addEventListener('input',function(ev){
  var t=ev.target;
  if(t.id==='dayNote'){ state.dayNote=t.value; save(); }
  if(t.id==='payQ'){ drawPayHist(); }
  if(t.id==='cashAmt'){ t.dataset.touched='1'; }
  if(t.id==='hoCash' || t.id==='hoNq' || t.id==='hoNote'){
    if(t.id==='hoNote') state.handover.note=t.value;
    else { var raw=String(t.value).replace(',','.').trim(), v=t.id==='hoNq'?parseInt(raw,10):parseFloat(raw);
      state.handover[t.id==='hoCash'?'cash':'nq'] = (raw===''||isNaN(v)||v<0) ? null : v; }
    save(); var R=report(), m=document.getElementById('hoMsg'), nb=document.getElementById('hoNoteBox');
    if(m) m.innerHTML=hoMsg(R); if(nb) nb.hidden=!hoGap(R);
  }
  if(t.dataset && t.dataset.sw){ if(draft && draft.sw){ var cs=t.value.replace(/\D/g,'').slice(0,4); if(cs!==t.value) t.value=cs; draft.sw[t.dataset.sw]=cs?parseInt(cs,10):0; } }
  if(t.dataset && t.dataset.fac){ /* facility form fields */ if(draft && draft.fac){ var clean=t.value.replace(/\D/g,'').slice(0,4); if(clean!==t.value) t.value=clean; draft.fac[t.dataset.fac]=clean?parseInt(clean,10):null; } }
});
document.addEventListener('keydown',function(ev){
  var t=ev.target; if(ev.key!=='Enter' || !t.dataset || !t.dataset.cin) return;
  ev.preventDefault();
  var all=[].slice.call(document.querySelectorAll('[data-cin]')), nx=all[all.indexOf(t)+1];
  var closed = nx && nx.closest('details') && !nx.closest('details').open;
  if(nx && !closed) nx.focus(); else t.blur();
});
document.addEventListener('change',function(ev){
  var t=ev.target;
  if(t.dataset && t.dataset.prev){
    var pv={}, none=true; document.querySelectorAll('[data-prev]').forEach(function(x){ var r=x.value.replace(/\D/g,''); if(r) none=false; pv[x.dataset.prev]=r?parseInt(r,10):null; });
    pv.km=pv.km||0; pv.gm=pv.gm||0; if(pv.kt==null) pv.kt=pv.km; if(pv.gt==null) pv.gt=pv.gm;   /* no total = no empties */
    if(none) state.prevManual=null;
    else { if(pv.kt<pv.km || pv.gt<pv.gm) toast('סה״כ המיכלים קטן ממספר המלאים — בדוק שוב');
      state.prevManual={date:'ידני', v:{km:pv.km, gm:pv.gm, kr:Math.max(0,pv.kt-pv.km), gr:Math.max(0,pv.gt-pv.gm)}}; }
    save(); render(); return; }
  if(t.id==='imp'){ var f=t.files && t.files[0]; t.value=''; if(f) importPdf(f); }
  if(t.id==='impAdd'){ var f2=t.files && t.files[0]; t.value=''; if(f2) importPdf(f2, true); }
  /* the pink form of the morning facility load, photographed right after the exit count */
  if(t.dataset && t.dataset.photo==='pinkx'){ readPhoto(t.files[0],function(u){ photos['pink-exit']=u; savePhotos(); state.pinkExit=true; save();
    var pv=document.getElementById('pinkxPrev'); if(pv) pv.innerHTML='<img class="thumb" src="'+u+'" alt="הטופס הוורוד">'; toast('הטופס הוורוד נשמר'); }); return; }
  if(t.dataset && t.dataset.photo==='offImg'){ var fo=t.files && t.files[0]; if(fo && draft){ draft.offImg=URL.createObjectURL(fo); document.getElementById('offImgPrev').innerHTML='<img class="thumb" src="'+draft.offImg+'" alt="הצילום שנבחר">'; } return; }
  if(t.dataset && t.dataset.photo){ var kind=t.dataset.photo;
    readPhoto(t.files[0],function(u){ if(!draft) return; draft[kind]=u; var pv=document.getElementById(kind+'Prev'); if(pv) pv.innerHTML='<img class="thumb" src="'+u+'" alt="התמונה שנבחרה">'; }); }
});

render();
startPolling();
if(/[?&]share=1/.test(location.search)){
  history.replaceState(null,'',location.pathname);
  caches.open('gazgal-share').then(function(c){ return Promise.all([c.match('shared-image'), c.match('shared-text')]).then(function(r){
    return Promise.all([r[0]?r[0].blob():null, r[1]?r[1].text():'']).then(function(v){ c.delete('shared-image'); c.delete('shared-text');
      if(!v[0] && !v[1]) return; officeIn={blob:v[0], text:v[1]||''}; openSheet('office'); }); }); }).catch(function(){});
}
loadPhotos().then(function(){ if(!document.querySelector('.loading') && !document.querySelector('.scrim')) render(); });

/* self-test: read a tiny built-in PDF so the driver sees at a glance that import will work here */
window.addEventListener('load',function(){
  if(!window.pdfjsLib || !window.pdfjsWorker){ pdfReady=false; if(state.phase==='morning') render(); return; }
  var src='%PDF-1.4\n1 0 obj<</Type/Catalog/Pages 2 0 R>>endobj\n2 0 obj<</Type/Pages/Kids[3 0 R]/Count 1>>endobj\n'+
    '3 0 obj<</Type/Page/Parent 2 0 R/MediaBox[0 0 200 50]/Contents 4 0 R/Resources<</Font<</F1 5 0 R>>>>>>endobj\n'+
    '4 0 obj<</Length 35>>stream\nBT /F1 12 Tf 10 20 Td (GAZGAL) Tj ET\nendstream endobj\n'+
    '5 0 obj<</Type/Font/Subtype/Type1/BaseFont/Helvetica>>endobj\ntrailer<</Root 1 0 R>>\n%%EOF';
  var bytes=new Uint8Array(src.length); for(var i=0;i<src.length;i++) bytes[i]=src.charCodeAt(i);
  pdfjsLib.getDocument({data:bytes, isEvalSupported:false}).promise
    .then(function(p){ return p.getPage(1); }).then(function(pg){ return pg.getTextContent(); })
    .then(function(tc){ pdfReady = tc.items.some(function(x){ return /GAZGAL/.test(x.str); }); })
    .catch(function(){ pdfReady=false; })
    .then(function(){ if(state.phase==='morning' && !document.querySelector('.loading')) render(); });
});

/* installed version: works offline after the first open.
   Updates never land mid-round (FEEDBACK #18): a new version downloads in the background and waits;
   it is switched on only when no round is open — in the first seconds after the app opens, or right
   after "סגור יום". Not on "app went to background": a file picker (PDF import, photo) does that too.
   During a round the driver just gets a one-time note. */
var swReg=null, swLaunch=Date.now(), swNoted=false, swSwitching=false;
function applyUpdate(force){
  var w=swReg && swReg.waiting; if(!w || swSwitching) return;
  if(state.phase==='route'){ if(!swNoted){ swNoted=true; toast('גרסה חדשה מוכנה — תותקן אחרי סגירת היום'); } return; }
  if(!force && Date.now()-swLaunch>15000) return; /* never reload under the driver's finger */
  swSwitching=true; w.postMessage('skipWaiting');
}
if('serviceWorker' in navigator && location.protocol==='https:' && !/claude/.test(location.host)){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js').then(function(reg){
      swReg=reg; applyUpdate(false);
      reg.addEventListener('updatefound',function(){ var n=reg.installing; if(n) n.addEventListener('statechange',function(){ if(n.state==='installed') applyUpdate(false); }); });
    }).catch(function(){});
    navigator.serviceWorker.addEventListener('controllerchange',function(){ if(swSwitching) location.reload(); });
  });
}

/* dev harness: on localhost only, ?pdf=<path> imports that file on load */
if(location.hostname==='localhost') window.__dbg={readCard:readCard, parseMsg:parseMsg, matchStop:matchStop, tess:tess, ocrWords:ocrWords, cropBin:cropBin, tightBlue:tightBlue, ocrBox:ocrBox, poll:function(){ return pollInbox(false,true); }};
window.addEventListener('load',function(){
  try{ if(location.hostname!=='localhost') return; var f=new URLSearchParams(location.search).get('pdf'); if(!f) return;
    fetch(f).then(function(r){ return r.blob(); }).then(function(b){ importPdf(b); }); }catch(e){}
});
})();

<script>
(function(){
/* ================= יומן טכנאי — prototype (04/10/2026) =================
   Kassem first. The office prints the technician's day from Bashan ("יומן עבודות לטכנאי", GG-645) as a PDF, the
   same way it does the driver's journal; the app reads it on the phone. Unlike a driver's stop, a technician's job has
   a time window the customer agreed with the office — the route follows the windows first, and the map only inside a
   window. A job is a conversation in two columns (UC-18): what the office wrote ("תקלה") and what the technician did
   ("ביצוע"). It ends done, postponed (with a new date — never "done" when it was not), or back to the office for
   another technician. The office page shows the day live, with a progress bar. */

var BOT_API = location.hostname==='localhost' ? 'http://localhost:8787' : 'https://bot.gazgal.com';
var KEY='gazgal-tech-v1', BOT_KEY_LS='gazgal-tech-key', BOT_ST_LS='gazgal-tech-status';
var OFFICE_TEL='0542222968', OFFICE_WA='972542222968';
var PAY={cash:'מזומן', cheque:'צ׳ק', office:'אשראי דרך המשרד', later:'ישלם למשרד', prepaid:'שולם מראש', unpaid:'לא שולם', none:'ללא חיוב'};
var CODES={'100':'בדיקה תקנית','90':'חיבור כיריים','71':'אספקה','74':'אספקה','77':'התקנה','40':'התקנת מונה'};
var POSTPONE=['הלקוח ביקש לדחות','הלקוח לא בבית','אין גישה','חסר ציוד / חלק','לא הספקתי היום','אחר'];
var CASUAL='99999999';

/* ================= reading the journal (Bashan GG-645, "יומן עבודות לטכנאי") =================
   A landscape page (rotated 90°), one row per job and its lines under it. Columns by x (after the page rotation):
   order 772 · date 715 · to 680 · from 648 · type 630 (לק / צר) · customer 575–600 · name 470–570 · central 413 ·
   meter 355–385 · street 280–345 · house ~250 · flat ~225 · town 160–210 · phone 1 ~83 · phone 2 ~21 · technician ~7.
   Lines: from 704 · to 674 · code 270–290 · text 100–268 · price < 70. A job's lines can go on to the next page. */
async function pdfItems(buf){
  var pdf=await pdfjsLib.getDocument({data:buf, isEvalSupported:false}).promise, pages=[];
  for(var p=1;p<=pdf.numPages;p++){ var page=await pdf.getPage(p), vp=page.getViewport({scale:1}), tc=await page.getTextContent();
    pages.push(tc.items.filter(function(t){ return t.str && t.str.trim(); }).map(function(t){ var m=pdfjsLib.Util.transform(vp.transform, t.transform);
      return {s:t.str.trim(), x:m[4], y:m[5], w:t.width}; })); }
  return pages;
}
function joinWords(items){   /* right to left; pieces that touch (ש " ח) stay together */
  items=items.slice().sort(function(a,b){ return b.x-a.x; }); var out='', prev=null;
  items.forEach(function(t){ out += prev && (prev.x-(t.x+t.w))<1.5 ? t.s : (out?' ':'')+t.s; prev=t; }); return out.trim(); }
function inX(items,a,b){ return items.filter(function(t){ return t.x>=a && t.x<b; }); }
function parseTechJournal(pages){
  var meta={no:'', date:'', tech:'', techNo:'', total:null}, jobs=[], job=null;
  pages.forEach(function(items){
    var rows=[]; items.slice().sort(function(a,b){ return a.y-b.y; }).forEach(function(t){ var r=rows[rows.length-1]; if(r && Math.abs(r.y-t.y)<=1.5) r.items.push(t); else rows.push({y:t.y, items:[t]}); });
    var head=rows.filter(function(r){ return r.y>80 && r.y<95; })[0], top=head ? head.y : 87;
    /* a job's header is spread over 2–3 rows around its order number (the address row is a point above it) */
    var ords=[]; rows.forEach(function(r){ var o=inX(r.items,755,800).filter(function(t){ return /^\d{4,6}$/.test(t.s); })[0]; if(o && r.y>top+3) ords.push({y:r.y, id:o.s}); });
    rows.forEach(function(r){ var tx=joinWords(r.items);
      if(r.y<top-5){   /* the page header */
        var jn=/יומן עבודות (\d+)/.exec(tx); if(jn) meta.no=jn[1];
        var dt=/תאריך\s*:\s*(\d\d\/\d\d\/\d{4})/.exec(tx); if(dt && r.y>30) meta.date=dt[1];
        if(r.y>55 && r.y<70){ var tn=inX(r.items,640,700)[0]; if(tn) meta.techNo=tn.s; meta.tech=joinWords(inX(r.items,480,640)); }
        return; }
      if(Math.abs(r.y-top)<3) return;
      var tot=/סה\s*"?\s*כ הזמנות\s*:\s*(\d+)/.exec(tx.replace(/"/g,'"')); if(tot){ meta.total=+tot[1]; return; }
      var near=ords.filter(function(o){ return Math.abs(o.y-r.y)<=3.5; })[0];
      if(near){ if(!job || job.id!==near.id){ job={id:near.id, row:jobs.length+1, items:[], lines:[]}; jobs.push(job); } job.items=job.items.concat(r.items); return; }
      if(!job) return;   /* lines before the first job on a page belong to the last job of the page before */
      if(inX(r.items,665,712).length===r.items.length) return;   /* only the window repeated — no text on this line */
      var code=inX(r.items,268,295).filter(function(t){ return /^\d{1,5}$/.test(t.s); })[0], price=inX(r.items,0,70).filter(function(t){ return /^[\d,.]+$/.test(t.s); })[0];
      var text=joinWords(inX(r.items,95,268));
      if(text || code || price) job.lines.push({code:code?code.s:'', text:text, price:price?parseFloat(price.s.replace(/,/g,'')):null});
    }); });
  /* the header row of each job, by column */
  jobs.forEach(function(j){ var it=j.items, g=function(a,b){ return joinWords(inX(it,a,b)); };
    j.date=g(700,740); j.to=g(668,700); j.from=g(640,668); j.type=g(615,640); j.cust=g(572,602).replace(/\D/g,'');
    j.name=g(462,572).replace(/[()]/g,function(c){ return c==='('?')':'('; });   /* the PDF keeps brackets in visual (mirrored) order */
    j.central=g(395,440).replace(/\D/g,''); j.meter=g(345,395).replace(/\D/g,''); j.street=g(275,345); j.house=g(238,262); j.apt=g(212,238); j.city=g(150,212);
    j.phones=[g(60,120), g(12,60)].map(function(p){ return p.replace(/[^\d-]/g,''); }).filter(Boolean);
    /* a line "<name> <role> 05x-xxxxxxx -" is a contact; "נאמר ללקוח 250 ש"ח" is the office's price */
    j.contacts=[]; var kept=[];
    j.lines.forEach(function(l){ var m=/^(.*?)\s*(0\d{1,2}-?\d{6,8})\s*-?$/.exec(l.text);
      if(m && !l.code && !/ש"?ח/.test(l.text)){ var nm=m[1].replace(/\s*-\s*$/,'').trim(), pv=kept[kept.length-1];
        /* "יוסף אבא של הלל בעל הנכס משלם -" and the phone on the next line are one contact */
        if(!nm && pv && !pv.code && !pv.price && /-\s*$/.test(pv.text)){ nm=pv.text.replace(/\s*-\s*$/,''); kept.pop(); }
        j.contacts.push({name:nm, phone:m[2]}); } else kept.push(l); });
    j.lines=kept;
    /* the office's price: what it told the customer ("נאמר ללקוח 1,500 ש"ח"). A per-meter / per-unit price ("כל מ' נוסף 50 ש"ח")
       is not added. Without any "said" amount — the price column of the lines. */
    var said=0, col=0; j.lines.forEach(function(l){ var unit=/נוסף|כל מ|למטר|ליחידה/.test(l.text);
      var p=/(?:נאמר|מחיר|עלות|תשלם)[^\d]*?([\d,]{2,7})\s*ש"?ח/.exec(l.text) || /([\d,]{2,7})\s*ש"ח/.exec(l.text);
      if(p){ l.said=parseFloat(p[1].replace(/,/g,'')); if(unit) l.unit=true; else said+=l.said; } if(l.price) col+=l.price; });
    j.officePrice=said||col||null;
    j.prepaid=j.lines.some(function(l){ return /שולם מראש/.test(l.text); }); j.free=j.lines.some(function(l){ return /ללא עלות|ללא תשלום/.test(l.text); });
    j.needs=j.lines.filter(function(l){ return /^(לקחת|להביא|לדאוג)/.test(l.text); }).map(function(l){ return l.text; });
    j.inspection=j.lines.some(function(l){ return l.code==='100' || /בדיקה תקנית/.test(l.text); });
    j.form=j.inspection ? (j.type==='צר' ? 'ד׳-3' : 'ד׳-4') : '';
    j.status='pending'; j.result=null; delete j.items; });
  return {meta:meta, jobs:jobs};
}
async function importPdf(file){
  if(!window.pdfjsLib){ toast('קורא ה־PDF עוד לא נטען — נסה שוב בעוד רגע'); return false; }
  pdfjsLib.GlobalWorkerOptions.workerSrc = (document.querySelector('script[src*="pdf.worker"]')||{}).src || '';
  try{
    var r=parseTechJournal(await pdfItems(await file.arrayBuffer()));
    if(!r.jobs.length){ toast('לא מצאתי עבודות בקובץ. זה ״יומן עבודות לטכנאי״ (GG-645)?'); return false; }
    var mem=state.memory; state=fresh(); state.memory=mem||{};
    state.source='pdf'; state.journal=r.meta.no; state.date=r.jobs[0].date ? r.jobs[0].date.replace(/(\d\d)\/(\d\d)\/(\d\d)$/,'$1/$2/20$3') : r.meta.date; state.tech=r.meta.tech; state.techNo=r.meta.techNo; state.jobs=r.jobs;
    if(r.meta.total!=null && r.meta.total!==r.jobs.length) toast('⚠ ביומן כתוב '+r.meta.total+' הזמנות ונקראו '+r.jobs.length+' — לבדוק');
    else toast('✓ נקראו '+r.jobs.length+' עבודות');
    save(); render(); return true;
  }catch(e){ toast('לא הצלחתי לקרוא את הקובץ'); try{ console.error(e); }catch(_){} return false; }
}

/* ================= the route: windows first, the map inside a window =================
   Jobs sorted by the window's start; jobs with the same window are ordered by the map, from where the previous one
   ends. The technician can always move a job up — the app then just warns if a later window would be missed. */
var geo=lsGet('gazgal-geo-v1',{}), lastGeo=0;
async function geocode(q){ if(Object.prototype.hasOwnProperty.call(geo,q)) return geo[q];
  var w=1100-(Date.now()-lastGeo); if(w>0) await sleep(w); lastGeo=Date.now();
  var r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=il&accept-language=he&q='+encodeURIComponent(q)); if(!r.ok) throw new Error('geo');
  var j=await r.json(), p=(j&&j[0])?[parseFloat(j[0].lat),parseFloat(j[0].lon)]:null; geo[q]=p; lsSet('gazgal-geo-v1',geo); return p; }
async function locate(j){ var m=state.memory[j.cust]; if(m && m.points && m.points[0]) return [m.points[0].lat, m.points[0].lon]; if(m && m.lat) return [m.lat,m.lon];
  if(j.street){ var p=await geocode((j.street+' '+(j.house||'')).trim()+', '+j.city); if(p) return p; }
  if(j.city) return await geocode(j.city); return null; }
function dist(a,b){ var rad=Math.PI/180, dLa=(b[0]-a[0])*rad, dLo=(b[1]-a[1])*rad, h=Math.sin(dLa/2)*Math.sin(dLa/2)+Math.cos(a[0]*rad)*Math.cos(b[0]*rad)*Math.sin(dLo/2)*Math.sin(dLo/2); return 12742*Math.asin(Math.sqrt(h)); }
function driveMin(a,b){ return Math.max(3, Math.round(dist(a,b)*1.35/50*60)); }
async function orderByWindows(){
  var app=document.getElementById('app'), P=pending(); app.innerHTML='<main><div class="loading"><div class="spin"></div>ממקם כתובות במפה…</div></main>';
  for(var i=0;i<P.length;i++){ if(P[i].pt===undefined){ try{ P[i].pt=await locate(P[i]); }catch(e){ P[i].pt=null; } } }
  var groups={}; P.forEach(function(j){ var k=(mins(j.from)||0)+'-'+(mins(j.to)||0); (groups[k]=groups[k]||[]).push(j); });
  var keys=Object.keys(groups).sort(function(a,b){ return (+a.split('-')[0])-(+b.split('-')[0]) || (+a.split('-')[1])-(+b.split('-')[1]); }), out=[], at=null;
  keys.forEach(function(k){ var left=groups[k].slice();
    while(left.length){ var bi=0; if(at){ var bd=Infinity; left.forEach(function(j,i){ if(j.pt){ var d=dist(at,j.pt); if(d<bd){ bd=d; bi=i; } } }); }
      var nx=left.splice(bi,1)[0]; out.push(nx); if(nx.pt) at=nx.pt; } });
  state.jobs=done().concat(out); state.phase='route'; save(); render(); window.scrollTo(0,0); toast('סודר לפי חלונות הזמן, ובתוך כל חלון לפי המפה');
}
/* when will he get to each job: now (or the last finish) + driving + the time at a job (measured today; 40 min until known) */
function jobMin(){ var d=done().filter(function(j){ return j.result && j.result.start && j.result.at; }).map(function(j){ return (j.result.at-j.result.start)/60000; }).filter(function(m){ return m>3 && m<300; });
  if(d.length<2) return 40; d.sort(function(a,b){ return a-b; }); return Math.round(d[Math.floor(d.length/2)]); }
function etas(){ if(dayOf()!==todayStr()) return {};   /* a journal for another day (loaded the evening before): no estimates yet */
  var t=nowMin(), at=null, last=done().filter(function(j){ return j.result && j.result.at; }).sort(function(a,b){ return b.result.at-a.result.at; })[0], svc=jobMin(), out={};
  if(last && last.pt) at=last.pt;
  pending().forEach(function(j,i){ var drive=at && j.pt ? driveMin(at,j.pt) : 15; var arrive=i===0 && j.startedAt ? mins(hhmm(j.startedAt)) : t+drive; var from=mins(j.from), to=mins(j.to);
    if(from!=null && arrive<from) arrive=from; out[j.id]={eta:arrive, late: to!=null && arrive>to};
    t=arrive+svc; if(j.pt) at=j.pt; });
  return out; }

/* ================= office link: pairing, journals from the office, live, the day's report ================= */
var bot={status:lsGet(BOT_ST_LS,'off')||'off', journals:[]};
function botKey(){ var k=null; try{ k=localStorage.getItem(BOT_KEY_LS); }catch(e){}
  if(!k){ var a=new Uint8Array(32); crypto.getRandomValues(a); k=[].map.call(a,function(b){ return ('0'+b.toString(16)).slice(-2); }).join(''); try{ localStorage.setItem(BOT_KEY_LS,k); }catch(e){} } return k; }
function botFetch(path,opt){ opt=opt||{}; opt.headers=Object.assign({authorization:'Bearer '+botKey()}, opt.headers||{}); return fetch(BOT_API+path,opt); }
function setBot(s){ bot.status=s; lsSet(BOT_ST_LS,s); }
async function pair(){
  var code=(document.getElementById('admCode')||{}).value||'', who=(document.getElementById('admTech')||{}).value||'';
  if(!code){ toast('קוד מנהל'); return; }
  try{ await fetch(BOT_API+'/api/pair',{method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({key:botKey(), name:'טכנאי', role:'tech'})});
    var r=await botFetch('/api/pair/admin',{method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({code:code, tech:who})});
    if(r.ok){ var j=await r.json(); setBot('active'); lsSet('gazgal-tech-name', j.name||''); closeSheet(); render(); toast('✓ מחובר למשרד — '+(j.name||'')); poll(); return; }
    toast(r.status===429?'יותר מדי ניסיונות — נסה בעוד שעה':'הקוד לא נכון');
  }catch(e){ toast('אין חיבור לשרת'); } }
async function poll(){
  if(bot.status!=='active') return;
  try{ var r=await botFetch('/api/journals'); if(r.status===401||r.status===403){ setBot('off'); render(); return; }
    if(r.ok){ var j=await r.json(), n=bot.journals.length; bot.journals=j.journals||[]; if(bot.journals.length>n){ toast('📄 הגיע יומן מהמשרד'); if(!document.querySelector('.scrim')) render(); } } }catch(e){}
  flushReport();
}
async function loadOfficeJournal(id){
  try{ var r=await botFetch('/api/journal/'+encodeURIComponent(id)); if(!r.ok){ toast('היומן כבר לא זמין — בקש מהמשרד לשלוח שוב'); return; }
    var ok=await importPdf(await r.blob()); if(ok){ bot.journals=bot.journals.filter(function(x){ return x.id!==id; }); botFetch('/api/journal/'+encodeURIComponent(id)+'/done',{method:'POST'}).catch(function(){}); render(); } }
  catch(e){ toast('אין קליטה — היומן לא ירד. נסה שוב.'); } }
/* the office page sees the day as it goes: every job with its window and status — no phones, no money */
function livePayload(pos){
  var E=etas(), svc=jobMin();
  var row=function(j,s){ var r=j.result||{}; return {o:j.id, n:j.name, c:custNo(j), a:addr(j), t:j.city, w:[j.from,j.to], s:s, at:r.at||0, why:r.reason||r.why||'', k:(j.lines.map(function(l){ return CODES[l.code]||''; }).filter(Boolean)[0]||''),
    eta: E[j.id] ? E[j.id].eta : null, late: E[j.id] ? E[j.id].late : false, nt:(r.note||'').slice(0,200)||undefined, re:j.status==='reassign'||undefined}; };
  return {kind:'tech', day:dayOf(), phase:state.phase, driver:state.tech, journals:[state.journal], svc:svc, lastAt:done().reduce(function(m,j){ return Math.max(m,(j.result||{}).at||0); },0),
    stops: done().slice().sort(function(a,b){ return ((a.result||{}).at||0)-((b.result||{}).at||0); }).map(function(j){ return row(j, j.status==='done'?'done':'failed'); })
      .concat(pending().map(function(j){ return row(j,'next'); })), pos:pos||null};
}
function scheduleLive(){ if(bot.status!=='active' || state.source!=='pdf') return; clearTimeout(scheduleLive.t); scheduleLive.t=setTimeout(sendLive, 5000); }
async function sendLive(closed){ if(bot.status!=='active') return; var pos=null;
  if(!closed && state.phase==='route'){ try{ var st=navigator.permissions ? await navigator.permissions.query({name:'geolocation'}) : null;
    if(st && st.state==='granted') pos=await new Promise(function(res){ navigator.geolocation.getCurrentPosition(function(p){ res({lat:Math.round(p.coords.latitude*1e5)/1e5, lon:Math.round(p.coords.longitude*1e5)/1e5, at:Date.now()}); }, function(){ res(null); }, {maximumAge:60000, timeout:8000}); }); }catch(e){} }
  try{ await botFetch('/api/live',{method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify(closed?{closed:true}:livePayload(pos))}); }catch(e){} }
function reportText(){
  var L=['יומן טכנאי '+state.journal+' · '+dayOf()+' · '+(state.tech||''), ''], t={cash:0,cheque:0,nq:0,later:0,office:0};
  state.jobs.forEach(function(j){ var r=j.result||{}, p=r.pay||{};
    L.push((j.status==='done'?'✓ ':j.status==='postponed'?'⏸ ':j.status==='reassign'?'↩ ':'• ')+j.id+' '+j.name+(custNo(j)?' ('+custNo(j)+')':'')+' — '+
      (j.status==='done' ? 'בוצע'+(r.exec&&r.exec.length?': '+r.exec.map(function(x){ return x.text+(x.price?' '+money(x.price):''); }).join(', '):'')+(r.note?' · '+r.note:'')+
        (p.method && p.method!=='none' ? ' · '+PAY[p.method]+(p.amount?' '+money(p.amount):'')+(p.no?' מס׳ '+p.no:'') : '')+(r.changed?' · שונה ממחיר המשרד ('+money(j.officePrice)+'): '+r.why:'')+(r.follow?' · ⚠ צריך הזמנת המשך: '+r.follow:'')
      : j.status==='postponed' ? 'נדחה — '+r.reason+(r.newDate?' · מועד חדש '+r.newDate:' · המשרד יתאם')+(r.note?' · '+r.note:'')
      : j.status==='reassign' ? 'לשיבוץ מחדש — '+r.reason+(r.level?' · נדרשת רמה '+r.level:'')
      : 'לא טופל'));
    if(j.status==='done' && p.method){ if(p.method==='cash') t.cash+=p.amount||0; if(p.method==='cheque'){ t.cheque+=p.amount||0; t.nq++; } if(p.method==='later') t.later+=p.amount||0; if(p.method==='office') t.office+=p.amount||0; } });
  L.push(''); L.push('קופה: מזומן '+money(t.cash)+' · צ׳קים '+money(t.cheque)+' ('+t.nq+')'+(t.office?' · אשראי דרך המשרד '+money(t.office):'')+(t.later?' · ישלמו למשרד '+money(t.later):''));
  return {text:L.join('\n'), t:t};
}

async function flushReport(){ if(bot.status!=='active') return; var out=lsGet('gazgal-tech-outbox',[]), left=[];
  for(var i=0;i<out.length;i++){ var it=out[i]; try{ var fd=new FormData(); fd.append('meta', JSON.stringify(it.meta)); fd.append('snap', it.snap);
      var r=await botFetch('/api/report',{method:'POST', body:fd}); if(!r.ok) throw 0; }catch(e){ left=out.slice(i); break; } }

        '<div id="chq" hidden class="grid2"><input class="inp num" id="chqNo" placeholder="מספר צ׳ק" inputmode="numeric"><input class="inp num" id="chqDue" type="date"></div></div>'+
      '<div class="field"><label for="note">הערה למשרד (לא חובה)</label><textarea class="inp" id="note" placeholder="מה שהיית כותב בתעודה"></textarea></div>'+
      '<div class="field"><span class="lbl">תמונה (לא חובה)</span>'+photoPick('ph','צלם')+'</div>'+
      '<div class="field"><div class="chips"><button type="button" class="chip" data-follow="1" aria-pressed="false">➕ צריך הזמנת המשך</button></div><input class="inp" id="follow" hidden placeholder="מה נשאר לעשות — למשל: להחליף רמפה בחוץ"></div>'+
      (c.form?'<div class="note">📋 טופס '+esc(c.form)+': בינתיים ממלאים בפנקס ומצלמים כאן. הטופס הדיגיטלי — בשלב הבא.</div>':'')+
      '<p class="err" id="dErr" hidden></p><button class="btn btn-ok" type="button" id="confirmDone">אישור — בוצע</button><button class="btn btn-ghost btn-sm" type="button" data-close>ביטול</button>';
  }
  if(kind==='postpone'){ draft={job:c.id, reason:null};
    html='<h2>⏸ נדחה — '+esc(c.name)+'</h2><p class="hint">העבודה לא בוצעה. היא חוזרת למשרד עם הסיבה — לא נסגרת כ״בוצעה״.</p>'+
      '<div class="field"><span class="lbl">למה?</span><div class="chips">'+POSTPONE.map(function(r){ return '<button type="button" class="chip" data-reason="'+r+'" aria-pressed="false">'+r+'</button>'; }).join('')+'</div></div>'+
      '<div class="field"><label for="newDate" class="lbl">מועד חדש (אם תואם עם הלקוח)</label><input class="inp" id="newDate" type="date"><p class="hint">ריק = המשרד יתאם.</p></div>'+
      '<div class="field"><label for="pNote">פירוט</label><textarea class="inp" id="pNote" placeholder="חובה ב״אחר״"></textarea></div>'+
      '<p class="err" id="pErr" hidden></p><button class="btn btn-bad" type="button" id="confirmPost">סמן כנדחה</button><button class="btn btn-ghost btn-sm" type="button" data-close>ביטול</button>'; }
  if(kind==='reassign'){ draft={job:c.id, level:null};
    html='<h2>↩ לשיבוץ מחדש — '+esc(c.name)+'</h2><p class="hint">העבודה דורשת טכנאי אחר או רמה אחרת. היא חוזרת למשרד עם הסיבה, והמשרד משבץ.</p>'+
      '<div class="field"><label for="rWhy">מה נדרש ולמה</label><textarea class="inp" id="rWhy" placeholder="למשל: נדרש תכנון לצובר — רמה 2"></textarea></div>'+
      '<div class="field"><span class="lbl">רמה נדרשת</span><div class="chips">'+['1','2'].map(function(l){ return '<button type="button" class="chip" data-level="'+l+'" aria-pressed="false">רמה '+l+'</button>'; }).join('')+'<button type="button" class="chip" data-level="" aria-pressed="false">לא יודע</button></div></div>'+
      '<p class="err" id="rErr" hidden></p><button class="btn btn-bad" type="button" id="confirmRe">החזר למשרד</button><button class="btn btn-ghost btn-sm" type="button" data-close>ביטול</button>'; }
  document.getElementById('sheetRoot').innerHTML='<div class="scrim" data-scrim><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>'+html+'</div></div>';
  if(kind==='done') drawExec();
}
function closeSheet(){ document.getElementById('sheetRoot').innerHTML=''; draft=null; }
function showErr(id,m){ var e=document.getElementById(id); e.hidden=false; e.textContent=m; }
function press(sel,t){ document.querySelectorAll(sel).forEach(function(b){ b.setAttribute('aria-pressed', b===t?'true':'false'); }); }
function after(msg){ save(); closeSheet(); render(); window.scrollTo(0,0); if(msg) toast(msg); }
function drawExec(){ var b=document.getElementById('execBox'); if(!b||!draft) return;
  b.innerHTML=draft.exec.length ? '<div class="lines">'+draft.exec.map(function(x,i){ return '<div class="ln exe"><span class="code">ביצוע</span><span>'+esc(x.text)+'</span><span class="pr num">'+(x.price?money(x.price):'')+' <button class="linkish" type="button" data-exdel="'+i+'" style="min-height:0;padding:0 6px">✕</button></span></div>'; }).join('')+'</div>' : '<p class="hint">עוד לא נוספה שורת ביצוע.</p>';
  var c=byId(draft.job), sum=draft.exec.reduce(function(t,x){ return t+(x.price||0); },0), tot=document.getElementById('tot');
  if(tot && !tot.dataset.touched && sum && !(c && c.officePrice)) tot.value=sum;
}
function confirmDone(){
  var c=byId(draft.job), g=function(id){ return ((document.getElementById(id)||{}).value||'').trim(); };
  var tot=parseFloat(g('tot').replace(',','.')), note=g('note'), why=g('why');
  if(!draft.exec.length && !note){ showErr('dErr','כתוב מה עשית — שורת ביצוע מהמחירון, עבודה אחרת או הערה.'); return; }
  if(!draft.method){ showErr('dErr','בחר תשלום (או ״ללא חיוב״).'); return; }
  if(['cash','cheque','office','later'].indexOf(draft.method)>=0 && !(tot>0)){ showErr('dErr','כתוב את הסכום לגבייה.'); return; }
  var changed = c.officePrice && tot>0 && Math.abs(tot-c.officePrice)>0.009;
  if(changed && !why){ showErr('dErr','המחיר שונה ממה שהמשרד אמר ('+money(c.officePrice)+') — כתוב למה.'); return; }
  if(draft.follow && !g('follow')){ showErr('dErr','כתוב מה נשאר לעשות בהזמנת ההמשך.'); return; }
  var pay={method:draft.method, amount:(draft.method==='none'||draft.method==='prepaid'||draft.method==='unpaid'&&!(tot>0))?0:(Math.round(tot*100)/100||0)};
  if(draft.method==='cheque'){ pay.no=g('chqNo'); pay.due=g('chqDue'); }
  if(!state.firstAt){ state.firstAt=Date.now(); state.day=todayStr(); }
  c.status='done'; c.result={at:Date.now(), start:c.startedAt||null, exec:draft.exec, pay:pay, note:note, changed:!!changed, why:why, office:c.officePrice||null, follow:draft.follow?g('follow'):''};
  if(draft.ph){ photos['p-'+c.id]=draft.ph; savePhotos(); c.result.photo=true; }
  after('✓ '+c.name+(pay.amount?' · '+PAY[pay.method]+' '+money(pay.amount):''));
}

/* ================= events ================= */
document.addEventListener('click',function(ev){
  var t=ev.target.closest('button,a,[data-scrim]'); if(!t) return;
  if(t.hasAttribute('data-scrim')){ if(ev.target===t) closeSheet(); return; }
  if(t.hasAttribute('data-close')){ closeSheet(); return; }
  var ds=t.dataset;
  if(ds.go){ var gj=byId(ds.go); if(gj){ gj.leftAt=Date.now(); save(); } }
  if(ds.view){ if(state.phase==='morning' && ds.view!=='route'){ toast('קודם מסדרים ויוצאים'); return; } state.view=ds.view; save(); render(); window.scrollTo(0,0); return; }
  if(ds.sheet){ openSheet(ds.sheet, ds.preset); return; }
  if(t.id==='doPair'){ pair(); return; }
  if(ds.jr){ loadOfficeJournal(ds.jr); return; }
  if(t.id==='goRoute'){ orderByWindows(); return; }
  if(ds.start){ var sj=byId(ds.start); if(sj){ sj.startedAt=Date.now(); save(); render(); } return; }
  if(ds.first){ var fj=byId(ds.first), c=cur(); if(fj && c && fj!==c){ var A=state.jobs; A.splice(A.indexOf(fj),1); A.splice(A.indexOf(c),0,fj); save(); closeSheet(); render(); window.scrollTo(0,0);
      var E=etas(), late=pending().filter(function(j){ return E[j.id] && E[j.id].late; }); toast(fj.name+' — העבודה הבאה'+(late.length?' · ⚠ '+late.length+' עבודות יגיעו אחרי החלון':'')); } return; }
  if(ds.reopen){ var rj=byId(ds.reopen); if(rj){ rj.status='pending'; rj.result=null; var A2=state.jobs; A2.splice(A2.indexOf(rj),1); var c2=cur(); A2.splice(c2?A2.indexOf(c2):A2.length,0,rj); save(); render(); toast('נפתח מחדש: '+rj.name); } return; }
  if(t.id==='exAdd'){ var tx=(document.getElementById('exText').value||'').trim(), pr=parseFloat((document.getElementById('exPrice').value||'').replace(',','.'));
    if(!tx){ toast('כתוב מה עשית'); return; } draft.exec.push({text:tx, price:pr>0?pr:null}); document.getElementById('exText').value=''; document.getElementById('exPrice').value=''; drawExec(); return; }
  if(ds.exdel){ draft.exec.splice(+ds.exdel,1); drawExec(); return; }
  if(ds.pay){ draft.method=ds.pay; press('[data-pay]',t); document.getElementById('chq').hidden=ds.pay!=='cheque'; return; }
  if(ds.follow){ draft.follow=!draft.follow; t.setAttribute('aria-pressed', draft.follow?'true':'false'); document.getElementById('follow').hidden=!draft.follow; return; }
  if(t.id==='confirmDone'){ confirmDone(); return; }
  if(ds.reason){ draft.reason=ds.reason; press('[data-reason]',t); return; }
  if(t.id==='confirmPost'){ var pj=byId(draft.job), pn=(document.getElementById('pNote').value||'').trim(), nd=document.getElementById('newDate').value;
    if(!draft.reason){ showErr('pErr','בחר סיבה.'); return; } if(draft.reason==='אחר' && !pn){ showErr('pErr','ב״אחר״ צריך פירוט.'); return; }
    if(!state.firstAt){ state.firstAt=Date.now(); state.day=todayStr(); }
    pj.status='postponed'; pj.result={at:Date.now(), reason:draft.reason, note:pn, newDate:nd?nd.split('-').reverse().join('/'):''}; after('⏸ '+pj.name+' — נדחה'); return; }
  if(ds.level!==undefined){ draft.level=ds.level; press('[data-level]',t); return; }
  if(t.id==='confirmRe'){ var rr=byId(draft.job), w=(document.getElementById('rWhy').value||'').trim();
    if(!w){ showErr('rErr','כתוב מה נדרש.'); return; }
    if(!state.firstAt){ state.firstAt=Date.now(); state.day=todayStr(); }
    rr.status='reassign'; rr.result={at:Date.now(), reason:w, level:draft.level||''}; after('↩ '+rr.name+' — חזר למשרד'); return; }
  if(t.id==='closeDay'){ if(!confirm('לסגור את היום ולשלוח את הסיכום למשרד?')) return; closeDay(); return; }
});
document.addEventListener('input',function(ev){ var t=ev.target; if(!draft) return;
  if(t.id==='tot'){ t.dataset.touched='1'; var c=byId(draft.job), v=parseFloat(t.value.replace(',','.')), wb=document.getElementById('whyBox'); if(wb) wb.hidden=!(c.officePrice && v>0 && Math.abs(v-c.officePrice)>0.009); } });
document.addEventListener('change',function(ev){ var t=ev.target;
  if(t.id==='imp'){ var f=t.files && t.files[0]; t.value=''; if(f) importPdf(f); return; }
  if(t.id==='plPick' && t.value!==''){ var p=PRICES[+t.value]; draft.exec.push({text:p[0], price:p[1]}); t.value=''; drawExec(); return; }
  if(t.dataset && t.dataset.photo){ var k=t.dataset.photo; readPhoto(t.files[0],function(u){ if(!draft) return; draft[k]=u; var pv=document.getElementById(k+'Prev'); if(pv) pv.innerHTML='<img class="thumb" src="'+u+'" alt="התמונה">'; }); }
});

render();
poll(); setInterval(poll, 60000); setInterval(function(){ if(state.phase==='route' && !document.hidden) sendLive(); }, 180000);
if('serviceWorker' in navigator && location.protocol==='https:') window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
if(location.hostname==='localhost') window.__tech={parse:parseTechJournal, items:pdfItems, state:function(){ return state; }};
})();
</script>
